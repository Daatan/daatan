events {
    worker_connections 1024;
}

http {
    # Docker internal DNS resolver (valid for 30s to respect container restarts)
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # combined + Accept-Language, so visitor browser language is observable
    # server-side (GA misses users who decline consent or block analytics)
    log_format lang '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_accept_language"';
    access_log /var/log/nginx/access.log lang;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=translate_limit:10m rate=120r/m;
    # Page renders (everything outside /api/ and /_next/static/). Sized for a human plus
    # a polite crawler: 2 r/s sustained, a 200-request burst so a page load's images and
    # prefetches never trip it. Exists because a backup-file scanner sent 4 078 requests
    # in 3 min on 2026-09-04, every one a full root-layout render of a 404, and pushed the
    # app into the kernel OOM killer (#1725).
    limit_req_zone $binary_remote_addr zone=page_limit:10m rate=120r/m;

    # Redirect HTTP to HTTPS (all production domains)
    server {
        listen 80;
        server_name daatan.com www.daatan.com localhost;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://daatan.com$request_uri;
        }
    }

    # Elections subdomain: ACME challenge passthrough + HTTP→HTTPS
    server {
        listen 80;
        server_name elections.daatan.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://elections.daatan.com$request_uri;
        }
    }

    # Redirect www to non-www (HTTPS)
    server {
        listen 443 ssl http2;
        server_name www.daatan.com;

        ssl_certificate /etc/letsencrypt/live/daatan.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/daatan.com/privkey.pem;

        return 301 https://daatan.com$request_uri;
    }

    # Main HTTPS server (canonical: daatan.com)
    server {
        listen 443 ssl http2;
        server_name daatan.com;

        ssl_certificate /etc/letsencrypt/live/daatan.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/daatan.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content-Security-Policy (Enforced)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://lh3.googleusercontent.com https://www.googletagmanager.com data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'; upgrade-insecure-requests;" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Auth routes: no add_header here so all Set-Cookie headers from NextAuth
        # pass through (avoids OAuth callback "state cookie missing" / session check failed)
        location /api/auth/ {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Translation endpoints — high burst to handle simultaneous feed card translation
        location ~ ^/api/forecasts/[^/]+/translate$ {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            limit_req zone=translate_limit burst=100 nodelay;
            limit_req_status 429;
        }

        # Bot runner — long synchronous job (creates/votes forecasts via LLM/Oracle
        # per due bot). Non-streaming, so it can't reset the read timer the way the
        # streaming LLM routes do; the 120s default times out and the runner gets a
        # 504. Match the route's maxDuration (300s) / workflow curl budget (270s).
        location = /api/bots/run {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 290;
            proxy_send_timeout 290;

            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
        }

        # AI panel sweep — same long-synchronous-job problem as /api/bots/run:
        # the first sweep of a day re-estimates every open forecast (5+ LLM
        # calls each), routinely outlasting the 120s default, so the scheduled
        # workflow saw 504s. The workflow curls with --max-time 600; nginx gets
        # a slightly longer budget so the workflow's own transport guard — not
        # the proxy — decides a slow sweep's fate.
        location = /api/cron/ai-panel {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 620;
            proxy_send_timeout 620;

            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
        }

        # Relation typer — up to `limit` sequential-ish LLM calls per run
        # (retro#574); the first prod dry run 504'd at the 120s default.
        # Workflow curls with --max-time 900.
        location = /api/cron/relation-typer {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 620;
            proxy_send_timeout 620;

            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
        }

        # Temporal-classifier backfill — same long-synchronous-job problem as
        # /api/bots/run above: a sequential loop of up to `limit` LLM calls with
        # no internal cap on total duration, so the 120s default cuts it off
        # mid-run with no response ever sent (client sees a network error, not
        # even a clean 504). Admin-only, deliberately invoked, so a generous
        # timeout carries no meaningful risk.
        location = /api/admin/forecasts/backfill-temporal {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1800;
            proxy_send_timeout 1800;

            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
        }

        # Evidence-pool remediate — same long-synchronous-job problem as
        # /api/admin/forecasts/backfill-temporal above: a multi-batch loop of
        # Oracle round-trips (~15-20s each) with no internal cap on total
        # duration, so the 120s default 504s partway through a large run
        # (daatan#1626, observed: 245 target rows / 17 batches). The route
        # keeps running server-side after nginx cuts the connection, so a
        # 504 here silently drops the caller's confirmation, not the work
        # itself. Admin-only, deliberately invoked, so a generous timeout
        # carries no meaningful risk.
        location = /api/admin/evidence-pool/remediate {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1800;
            proxy_send_timeout 1800;

            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
        }

        # LLM expensive routes
        location ~ ^/api/(forecasts/express/generate|ai/extract) {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            limit_req zone=llm_limit burst=5 nodelay;
            limit_req_status 429;
        }

        # API routes
        location /api/ {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            limit_req zone=api_limit burst=60 nodelay;
            limit_req_status 429;
        }

        # Build assets: content-hashed, immutable, and not a render — kept outside the
        # page_limit budget so a first page load (30–40 chunks) cannot eat the burst.
        location /_next/static/ {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Proxy all other requests to Next.js app
        location / {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120;

            limit_req zone=page_limit burst=200 nodelay;
            limit_req_status 429;
        }
    }

    # ELECTIONS subdomain (elections.daatan.com) — proxied to the STANDALONE
    # `elections` container (Daatan/elections repo), NOT the daatan app. It has its
    # own Let's Encrypt cert and runs on the shared app_default network, so nginx
    # reaches it as `elections:3000`. (The elections container is deployed from its
    # own repo; this block only routes to it.)
    server {
        listen 443 ssl http2;
        server_name elections.daatan.com;
        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/letsencrypt/live/elections.daatan.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elections.daatan.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /_next/static/ {
            set $upstream_el http://elections:3000;
            proxy_pass $upstream_el;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            set $upstream_el http://elections:3000;
            proxy_pass $upstream_el;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;

            # Same budget as daatan.com's pages: every elections page is force-dynamic,
            # so crawler bursts here cost the same host RAM (Daatan/elections#184).
            limit_req zone=page_limit burst=200 nodelay;
            limit_req_status 429;
        }
    }
}
