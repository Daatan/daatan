services:
  nginx:
    image: nginx:alpine
    container_name: daatan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx-prod-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "--header=Host: localhost", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=postgresql://daatan:${POSTGRES_PASSWORD}@postgres:5432/daatan
        - NEXTAUTH_URL=https://daatan.com
    image: ${ECR_REGISTRY:-272007598366.dkr.ecr.eu-central-1.amazonaws.com}/daatan-app:staging-latest
    container_name: daatan-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - DATABASE_URL=postgresql://daatan:${POSTGRES_PASSWORD}@postgres:5432/daatan
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://daatan.com
      - AUTH_TRUST_HOST=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - SCRAPINGBEE_API_KEY=${SCRAPINGBEE_API_KEY}
      - BRIGHTDATA_API_KEY=${BRIGHTDATA_API_KEY}
      - NIMBLEWAY_API_KEY=${NIMBLEWAY_API_KEY}
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID_PROD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_ROLLBACK_CHAT_IDS=${TELEGRAM_ROLLBACK_CHAT_IDS}
      - TELEGRAM_ADMIN_MAP=${TELEGRAM_ADMIN_MAP}
      - GH_ROLLBACK_TOKEN=${GH_ROLLBACK_TOKEN}
      - STAGING_URL=${STAGING_URL:-https://staging.daatan.com}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_CLEAN_CHAT_ID=${TELEGRAM_CLEAN_CHAT_ID}
      - BOT_RUNNER_SECRET=${BOT_RUNNER_SECRET}
      - TEMPORAL_CLOCK_DISABLED=${TEMPORAL_CLOCK_DISABLED:-}
      - NEWS_INDEXER_SECRET=${NEWS_INDEXER_SECRET}
      - NEWS_INDEXER_URL=${NEWS_INDEXER_URL}
      - NEWS_INDEXER_API_KEY=${NEWS_INDEXER_API_KEY}
      - AI_PANEL_GROUNDED_TAG=${AI_PANEL_GROUNDED_TAG}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-Daatan <noreply@daatan.com>}
      - MAX_BOTS=${MAX_BOTS:-50}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - ORACLE_URL=${ORACLE_URL}
      - ORACLE_API_KEY=${ORACLE_API_KEY}
      - INDEXNOW_KEY=${INDEXNOW_KEY}
      - GOOGLE_INDEXING_CLIENT_EMAIL=${GOOGLE_INDEXING_CLIENT_EMAIL}
      - GOOGLE_INDEXING_PRIVATE_KEY=${GOOGLE_INDEXING_PRIVATE_KEY}
      - GOOGLE_VERTEX_PROJECT_ID=${GOOGLE_VERTEX_PROJECT_ID}
      - GOOGLE_VERTEX_LOCATION=${GOOGLE_VERTEX_LOCATION}
      - GOOGLE_VERTEX_CLIENT_EMAIL=${GOOGLE_VERTEX_CLIENT_EMAIL}
      - GOOGLE_VERTEX_PRIVATE_KEY=${GOOGLE_VERTEX_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # Pinned by digest on purpose: the mutable :pg16 tag silently swapped its
    # glibc/ICU on an upstream rebuild, which corrupted text btree indexes via a
    # collation-version mismatch (slug/username lookups returned 0 rows).
    # Change this digest deliberately, then REINDEX + verify. See docs/DATABASE_COLLATION.md
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    container_name: daatan-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=daatan
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=daatan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U daatan -d daatan" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot for SSL renewal — uses DNS challenge via Route53 (requires daatan-ec2-role-prod IAM permissions)
  certbot:
    image: certbot/dns-route53
    container_name: daatan-certbot
    # Without this the container dies permanently on every instance reboot and
    # cert renewal silently stops (found during the 2026-07-16 t3.medium resize).
    restart: unless-stopped
    environment:
      - AWS_DEFAULT_REGION=eu-central-1
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
