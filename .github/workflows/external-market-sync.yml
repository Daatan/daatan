name: External Market Sync

# Hourly trigger for /api/cron/external-market-sync, which refreshes every cached
# Polymarket/Kalshi market that a forecast links to: pulls the latest YES price,
# writes a price snapshot (drives the "Market" line on the forecast history chart),
# and updates resolution status.
#
# WHERE THIS RUNS:
#   A GitHub Actions runner makes the HTTP request; the EC2 app process does the
#   work (provider fetch → DB write). Same mechanism as heartbeat.yml /
#   search-health.yml — not an EC2 crontab.

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17 (off the top of the hour)
  workflow_dispatch:

jobs:
  sync:
    name: Sync ${{ matrix.env.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: production
            url: https://daatan.com
          - name: staging

    steps:
      - name: Trigger external-market sync
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
        run: |
          ENV="${{ matrix.env.name }}"
          if [ "$ENV" = "staging" ]; then
            BASE="$STAGING_URL"
          else
            BASE="${{ matrix.env.url }}"
          fi

          if [ -z "$BASE" ]; then
            echo "⚠️ No URL configured for $ENV — skipping"
            exit 0
          fi

          # The endpoint validates x-cron-secret against env.BOT_RUNNER_SECRET on
          # the server (src/app/api/cron/external-market-sync/route.ts).
          HTTP=$(curl -s -o /tmp/sync_body.txt -w "%{http_code}" \
            --max-time 30 \
            -H "x-cron-secret: $BOT_RUNNER_SECRET" \
            "$BASE/api/cron/external-market-sync")

          BODY=$(cat /tmp/sync_body.txt)
          echo "HTTP $HTTP — $BODY"

          if [ "$HTTP" = "200" ]; then
            echo "✅ Sync OK for $ENV"
          elif [ "$HTTP" = "404" ]; then
            # The route ships with v1.11.11+; until prod is tagged it 404s — not an error.
            echo "ℹ️ Route not deployed yet on $ENV (HTTP 404) — skipping"
          else
            echo "❌ Sync failed for $ENV (HTTP $HTTP)"
            exit 1
          fi
