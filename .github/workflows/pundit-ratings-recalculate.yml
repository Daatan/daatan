name: Pundit Ratings Recalculate

# Daily trigger for POST /api/admin/pundit-ratings/recalculate, the only path
# that (re)computes PunditTagRating (daatan#1293) — pundits don't commit, so
# there's no resolution transaction to hook, and elections' read-only subset
# schema can never write to trigger a seed itself. Without this cron the
# table sits empty forever, even as predictions resolve.
#
# WHERE THIS RUNS:
#   A GitHub Actions runner makes the HTTP request; the EC2 app process does
#   the work (delete + full-history replay via ensurePunditTagRatingsSeeded).
#   Same mechanism as requote.yml / external-market-sync.yml — not an EC2
#   crontab. Idempotent — safe to run any time, and safe to re-run manually.
#
# TAG SCOPE:
#   Hardcoded to the one tag that has pundit evidence today, matching the
#   route's own default. A missing tag on an environment 404s cleanly rather
#   than erroring (see the HTTP-404 branch below) — safe to run unconditionally
#   against both hosts even if staging's DB isn't seeded with this tag.

on:
  schedule:
    - cron: '15 6 * * *'   # daily 06:15 UTC (off the hour, clear of backup/requote)
  workflow_dispatch:

jobs:
  recalculate:
    name: Recalculate ${{ matrix.env.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: production
            url: https://daatan.com
          - name: staging

    steps:
      - name: Trigger pundit-ratings recalculation
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
        run: |
          ENV="${{ matrix.env.name }}"
          if [ "$ENV" = "staging" ]; then
            BASE="$STAGING_URL"
          else
            BASE="${{ matrix.env.url }}"
          fi

          if [ -z "$BASE" ]; then
            echo "⚠️ No URL configured for $ENV — skipping"
            exit 0
          fi

          # The endpoint validates x-cron-secret against env.BOT_RUNNER_SECRET on
          # the server (src/app/api/admin/pundit-ratings/recalculate/route.ts).
          HTTP=$(curl -s -o /tmp/recalc_body.txt -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "x-cron-secret: $BOT_RUNNER_SECRET" \
            "$BASE/api/admin/pundit-ratings/recalculate?tag=israeli-elections-2026")

          BODY=$(cat /tmp/recalc_body.txt)
          echo "HTTP $HTTP — $BODY"

          if [ "$HTTP" = "200" ]; then
            echo "✅ Recalculation OK for $ENV"
          elif [ "$HTTP" = "404" ]; then
            # Either the route isn't deployed yet on $ENV, or this env's DB has no
            # israeli-elections-2026 tag (e.g. staging not seeded from prod) — both
            # are graceful no-ops, not failures.
            echo "ℹ️ Route not deployed or tag not found on $ENV (HTTP 404) — skipping"
          else
            echo "❌ Recalculation failed for $ENV (HTTP $HTTP)"
            exit 1
          fi
