name: Weekly LLM Waste Report
#
# The measurement half of docs#57. That finding was possible only because
# someone went to CloudWatch by hand: nothing in the stack persists LLM token
# usage (ArticleDebug.gate_tokens/extract_tokens are computed and discarded,
# oracle_call_logs records duration but not tokens), so spend is invisible
# in-stack and stays invisible until it is looked at from outside.
#
# The sharper reason this exists: every cost argument in the codebase was made
# against numbers 4-11x off — the endorsement cap's "a wrongly-judged post costs
# $0.00002", the curated path's "$5/month so we delete the filter", and the
# decision to run the exhaustive path at all. A weekly number is what keeps the
# next such argument honest.
#
# Deliberately a WASTE report, not a spend report. Spend alone cannot be acted
# on; spend over usable output can. The denominator is new COMPLETE pool rows —
# articles that actually became evidence — read from the app over HTTP rather
# than stopping at Cost Explorer. docs#57 measured $0.0588 per
# usable pooled article with an estimated 53-63% producing zero production
# evidence; this reports the same ratio every week so a regression is visible
# within days instead of at the next manual audit.
#
# Noisy channel, matching cost-report.yml — an operational digest, not a page.

on:
  schedule:
    - cron: '30 12 * * 1'   # Mondays 12:30 UTC — after the daily cost report at 12:00
  workflow_dispatch:

jobs:
  llm-waste-report:
    name: Send weekly LLM waste report
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Query LLM spend (last 7 full UTC days, by service)
        id: spend
        # Never fail the job, for the same reason as the denominator step below:
        # a failed step posts nothing, and a silent week is indistinguishable
        # from a week nobody looked at. A broken numerator degrades the message.
        continue-on-error: true
        run: |
          set -e
          START=$(date -u -d '7 days ago' +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          PREV_START=$(date -u -d '14 days ago' +%Y-%m-%d)

          # Cost Explorer lives in us-east-1 regardless of where the resources are.
          # RECORD_TYPE=Usage is gross spend, not netted against credits — the same
          # basis cost-report.yml uses, so the two reports never disagree.
          #
          # Anthropic models do NOT bill under the "Amazon Bedrock" service. AWS
          # gives each third-party model its own SERVICE dimension value, e.g.
          # "Claude Haiku 4.5 (Amazon Bedrock Edition)". Filtering to
          # ["Amazon Bedrock"] therefore dropped the account's single largest LLM
          # line: spend was understated 3-8x on every run and the week-over-week
          # delta came out wrong in sign as well as magnitude (#1275).
          #
          # So the service list is DISCOVERED, never hardcoded — a hardcoded set is
          # the same bug again, deferred to the next model adoption. It is
          # discovered from the cost data itself (group by SERVICE, no service
          # filter, then match on the name) rather than from a separate
          # ce:GetDimensionValues call, because this role does not have that
          # permission — a dispatch against the real role returned
          # AccessDeniedException on GetDimensionValues. This shape needs no IAM
          # change at all: it is exactly the call cost-report.yml already makes
          # with this same role every day.
          aws ce get-cost-and-usage --region us-east-1 \
            --time-period "Start=${START},End=${END}" \
            --granularity MONTHLY --metrics "UnblendedCost" \
            --filter '{"Dimensions":{"Key":"RECORD_TYPE","Values":["Usage"]}}' \
            --group-by Type=DIMENSION,Key=SERVICE \
            --output json > /tmp/spend_now.json

          aws ce get-cost-and-usage --region us-east-1 \
            --time-period "Start=${PREV_START},End=${START}" \
            --granularity MONTHLY --metrics "UnblendedCost" \
            --filter '{"Dimensions":{"Key":"RECORD_TYPE","Values":["Usage"]}}' \
            --group-by Type=DIMENSION,Key=SERVICE \
            --output json > /tmp/spend_prev.json

          # API responses are untrusted input: written to a file and read back,
          # never interpolated into source (same rule as cost-report.yml).
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys

          def by_service(path):
              rows = {}
              for period in json.load(open(path)).get('ResultsByTime', []):
                  for g in period.get('Groups', []):
                      name = g['Keys'][0]
                      if 'bedrock' not in name.lower():
                          continue
                      amt = float(g['Metrics']['UnblendedCost']['Amount'])
                      rows[name] = rows.get(name, 0.0) + amt
              return rows

          cur, prv = by_service('/tmp/spend_now.json'), by_service('/tmp/spend_prev.json')
          # Matching nothing must not be able to report $0.00 — the absence of a
          # measurement must never be quotable as a measurement.
          if not cur:
              sys.exit('no Bedrock services in the cost data; refusing to report a total')
          print('services in scope: ' + ', '.join(sorted(cur)), file=sys.stderr)
          now, prev = sum(cur.values()), sum(prv.values())

          print(f'total={now:.2f}')
          print(f'prev={prev:.2f}')
          delta = ((now - prev) / prev * 100) if prev > 0 else 0.0
          print(f'delta={delta:+.0f}')
          # Break down by SERVICE, not USAGE_TYPE: with more than one service in
          # scope, a bare "USE1-MP:USE1_CacheWriteInputTokenCount-Units" line does
          # not say which model it belongs to, and per-model is the actionable cut.
          print('breakdown<<LLMEOF')
          for name, amt in sorted(cur.items(), key=lambda kv: -kv[1])[:5]:
              if amt > 0.005:
                  print(f'  {name}: ${amt:,.2f}')
          print('LLMEOF')
          PY

      - name: Query usable output from prod (the denominator)
        id: output
        # Never fail the job. A failed step posts NOTHING, and silence is the
        # one outcome this report may not produce — a week with no message is
        # indistinguishable from a week nobody looked at. A broken denominator
        # degrades the message instead (see the ERROR branch below).
        continue-on-error: true
        env:
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
        run: |
          set +e
          # `usable` is the denominator the cost-per-article number divides by;
          # `attempted` is every row the extractor was spent on, so
          # attempted-minus-usable IS the waste.
          #
          # This was an SSM send-command → docker exec → psql round-trip, which
          # needed ssm:GetCommandInvocation on the CI role just to read its own
          # answer back — widening a CI role's read access to every SSM command
          # result in the account, to count two integers (#1274). The app owns
          # this data and already authenticates machines with x-cron-secret (the
          # other routes under /api/cron), so this is a plain HTTP call: no IAM
          # change, and nothing here can run arbitrary shell on prod.
          HTTP=$(curl -s -o /tmp/pool_stats.json -w '%{http_code}' --max-time 20 \
            -H "x-cron-secret: ${BOT_RUNNER_SECRET}" \
            "https://daatan.com/api/cron/evidence-pool-stats?days=7")
          echo "HTTP ${HTTP}"

          # Report ERROR rather than letting a broken query read as "$0.00 per
          # article" — a broken measurement must never read as free, which is
          # exactly the shape of failure this report exists to catch.
          python3 - "$HTTP" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          try:
              if sys.argv[1] != '200':
                  raise ValueError(f'HTTP {sys.argv[1]}')
              d = json.load(open('/tmp/pool_stats.json'))
              usable, attempted = int(d['usable']), int(d['attempted'])
          except Exception as exc:
              # stderr, not stdout: stdout is $GITHUB_OUTPUT here.
              print(f'denominator query failed: {exc}', file=sys.stderr)
              usable = attempted = 'ERROR'
          print(f'usable={usable}')
          print(f'attempted={attempted}')
          PY

      - name: Post to Telegram
        # always(): the message goes out even if a query step degraded, because
        # a silent week is the failure mode this report exists to prevent.
        if: always()
        env:
          TOTAL: ${{ steps.spend.outputs.total }}
          PREV: ${{ steps.spend.outputs.prev }}
          DELTA: ${{ steps.spend.outputs.delta }}
          BREAKDOWN: ${{ steps.spend.outputs.breakdown }}
          USABLE: ${{ steps.output.outputs.usable }}
          ATTEMPTED: ${{ steps.output.outputs.attempted }}
        run: |
          python3 - <<'PY' > /tmp/msg.txt
          import os
          # A degraded step leaves its outputs empty rather than unset, so read
          # defensively and treat empty as ERROR — never as zero. Reporting $0.00
          # spend because the query broke is the exact failure this report exists
          # to catch, and it must not be able to commit it itself.
          total = os.environ.get('TOTAL', '').strip()
          prev = os.environ.get('PREV', '').strip()
          delta = os.environ.get('DELTA', '').strip()
          usable = os.environ.get('USABLE', '').strip()
          attempted = os.environ.get('ATTEMPTED', '').strip()
          lines = ["🔥 <b>Weekly LLM waste — last 7 days</b>", ""]
          if not total:
              lines.append("⚠️ <b>Could not read LLM spend from Cost Explorer</b> — no spend figure this week.")
          else:
              lines.append(f"<b>LLM spend (gross): ${total}</b>  ({delta}% vs prior week, ${prev})")
              bd = os.environ.get('BREAKDOWN', '').strip()
              if bd:
                  lines += [bd]
          lines.append("")
          if not usable or not attempted or 'ERROR' in (usable, attempted):
              lines.append("⚠️ <b>Could not read usable-output counts from prod</b> — cost-per-article unavailable this week.")
          else:
              u, a = int(usable), int(attempted)
              per = (float(total) / u) if (u and total) else None
              waste = (1 - u / a) * 100 if a else 0.0
              lines.append(f"<b>Usable pooled articles:</b> {u:,} of {a:,} attempted")
              lines.append(f"<b>Waste:</b> {waste:.0f}% of extractions produced no usable evidence")
              if per is not None:
                  lines.append(f"<b>Cost per usable article:</b> ${per:.4f}")
                  # docs#57's measured baseline, so the number has something to mean.
                  lines.append(f"  <i>baseline 2026-08-02: $0.0588/article, 53-63% waste</i>")
          # Real newlines, not %0A: the curl below uses --data-urlencode, which
          # encodes them correctly. cost-report.yml hand-escapes because it uses
          # plain -d; mixing the two would double-encode and print literal "%0A".
          print("\n".join(lines))
          PY

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text@/tmp/msg.txt" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
