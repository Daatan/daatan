name: CI/CD Pipeline

env:
  ECR_REGISTRY: 272007598366.dkr.ecr.eu-central-1.amazonaws.com

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Target version tag (e.g. v1.1.1) for manual production deploy (optional)'
        required: false
        type: string

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    concurrency:
      group: typecheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Type check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run linter
        run: npm run lint

  # PR-only: fast related-tests loop (same logic as .husky/pre-push — see
  # scripts/run-related-tests.sh). Kept as its own unsharded job so its
  # check name ("Unit tests") stays stable for branch-protection's required
  # status check — see unit-test-full below for the push-to-main path.
  unit-test:
    name: Unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: unit-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Needed to diff against the PR base ref for related-test selection below.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run related tests
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "dummy-secret-for-build-long-enough-32-chars-!!"
          SKIP_ENV_VALIDATION: 1
        run: ./scripts/run-related-tests.sh ${{ github.event.pull_request.base.sha }}

  # Push to main (or a tag): run the full suite as a safety net, sharded
  # across 4 parallel runners instead of one serial `npm test` (measured
  # ~2m19s serial in CI vs a local ~80s run — most of the gap is fixed
  # per-process CI/Node overhead, which sharding pays once per shard
  # concurrently rather than once total serially; ~2026-08-23 timing).
  # Separate job (not a matrix on `unit-test` above) so PRs — where branch
  # protection requires a status check literally named "Unit tests" — never
  # see a matrix-suffixed check name like "Unit tests (1)".
  unit-test-full:
    name: Unit tests (full suite)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: unit-test-full-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run test shard
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "dummy-secret-for-build-long-enough-32-chars-!!"
          SKIP_ENV_VALIDATION: 1
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # Build and test (runs on all pushes and PRs)
  build:
    name: Build & Test
    needs: [typecheck, lint, unit-test, unit-test-full]
    # Default needs-gating (all must succeed) doesn't fit here: unit-test
    # and unit-test-full are mutually exclusive by event (see their `if`
    # above), so exactly one of them is always "skipped" — explicitly
    # tolerate that instead of the whole job skipping too.
    if: |
      always() &&
      needs.typecheck.result == 'success' &&
      needs.lint.result == 'success' &&
      (needs.unit-test.result == 'success' || needs.unit-test.result == 'skipped') &&
      (needs.unit-test-full.result == 'success' || needs.unit-test-full.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.app_version.outputs.version }}
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # Only needed on PRs: they're the only event where the Docker build below
      # is skipped, so this is the sole build-correctness check. On push/tag/
      # workflow_dispatch, the Dockerfile runs its own npm ci + build — running
      # it again here first is pure duplicate work (~1.5min/push measured
      # 2026-08-08, daatan#1315). A broken build still fails the job either
      # way; on push it just surfaces during the Docker build step instead.
      - name: Cache Next.js build
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build application
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "dummy-secret-for-build-long-enough-32-chars-!!"
          NEXTAUTH_URL: "http://localhost:3000"
          SKIP_ENV_VALIDATION: 1
        run: npm run build

      - name: Security audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Check env var parity (blue-green-deploy.sh vs docker-compose.prod.yml)
        run: ./scripts/check-env-parity.sh

      - name: Set app version for build
        if: github.event_name != 'pull_request'
        id: app_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APP_VER="${GITHUB_REF#refs/tags/v}"
          else
            APP_VER="$(node -p "require('./package.json').version")"
          fi
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "Using NEXT_PUBLIC_APP_VERSION=$APP_VER"

  # Build and push the app image to ECR (skip on PRs to save ECR storage).
  # Split from the migrations build below (daatan#1393) into its own job so
  # the two ~5min Docker builds run concurrently instead of back-to-back
  # (~10-11min sequential, daatan#1315). This is the only one of the pair
  # with cache-to: two concurrent writers to the same BuildKit cache scope
  # can race/corrupt it, so build-migrations-image stays cache-from-only.
  # Images are built once per commit, on main (or a staging dispatch). A `v*` tag
  # never rebuilds: resolve-release promotes the digest this build pushed, after
  # its staging deploy succeeded (daatan#1954 — tag rebuilds overwrote
  # staging-latest and raced the main deploy, 3/3 times on 2026-10-18).
  build-app-image:
    name: Build & Push App Image
    needs: build
    # always() + explicit needs.build.result check, not a bare event-name
    # if: default success() gating walks the whole transitive needs chain,
    # not just direct needs — since unit-test/unit-test-full are mutually
    # exclusive by event (one is always "skipped"), that skip poisons the
    # implicit success() here even though `build` itself succeeded. Same
    # fix already applied to deploy-production; missing here broke every
    # push-to-main deploy silently until caught 2026-08-23.
    if: |
      always() &&
      needs.build.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: build-app-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/daatan-app
          tags: |
            type=sha,format=short
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.build.outputs.app_version }},enable={{is_default_branch}}

      - name: Build and push to ECR
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.build.outputs.app_version }}
            GIT_COMMIT=${{ github.sha }}
            DATABASE_URL=postgresql://placeholder
            NEXTAUTH_URL=https://daatan.com
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

  # Build and push the migrations image to ECR, in parallel with
  # build-app-image above. Read-only on the shared BuildKit cache
  # (cache-from only, no cache-to) — see the comment on build-app-image
  # for why only one side of this pair may write it.
  build-migrations-image:
    name: Build & Push Migrations Image
    needs: build
    # See the comment on build-app-image's `if` above — same fix.
    if: |
      always() &&
      needs.build.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: build-migrations-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push migrations image to ECR
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: migrations
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/daatan-app:sha-${{ steps.sha.outputs.short }}-migrations
            ${{ github.ref == 'refs/heads/main' && format('{0}/daatan-app:staging-latest-migrations', steps.login-ecr.outputs.registry) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/daatan-app:{1}-migrations', steps.login-ecr.outputs.registry, needs.build.outputs.app_version) || '' }}
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.build.outputs.app_version }}
            GIT_COMMIT=${{ github.sha }}
            DATABASE_URL=postgresql://placeholder
            NEXTAUTH_URL=https://daatan.com
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

  # Integration tests (runs on all pushes and PRs, in parallel with build)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    concurrency:
      group: integration-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run integration tests
        run: npm run test:integration

  # Deploy to STAGING (on push to main)
  deploy-staging:
    name: Deploy to Staging
    needs: [build, build-app-image, build-migrations-image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # always() + explicit needs.*.result checks, not a bare event-name if:
    # default success() gating walks the whole transitive needs chain, not
    # just direct needs — since unit-test/unit-test-full are mutually
    # exclusive by event (one is always "skipped"), that skip poisoned the
    # implicit success() here even though build/build-app-image/
    # build-migrations-image all succeeded. Same fix already applied to
    # deploy-production; missing here broke every push-to-main deploy
    # silently until caught 2026-08-23.
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build-app-image.result == 'success' &&
      needs.build-migrations-image.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Get source branch
        id: source_branch
        run: |
          MSG=$(git log -1 --pretty=%s)
          SOURCE=$(echo "$MSG" | grep -oP 'from [^/]+/\K[\w/._-]+' | head -1 || echo "")
          echo "name=${SOURCE:-main}" >> $GITHUB_OUTPUT

      - name: Wake staging if asleep and wait for SSM
        # Staging sleeps 20:00–06:00 UTC + weekends (terraform/staging_schedule.tf,
        # #1526). Start it if stopped, then wait for the SSM agent to report
        # Online before sending commands. A running box passes straight through.
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=staging" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance $INSTANCE_ID state: $STATE"
          if [[ "$STATE" == "stopped" ]]; then
            echo "⏰ Staging is asleep — starting it"
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          elif [[ "$STATE" == "stopping" ]]; then
            echo "⏳ Staging is stopping — waiting, then starting"
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          fi

          for i in $(seq 1 30); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)
            echo "SSM PingStatus: $PING_STATUS ($i/30)"
            [[ "$PING_STATUS" == "Online" ]] && exit 0
            sleep 10
          done
          echo "❌ Error: staging SSM agent not Online after 5 min. Please check or reboot the instance."
          exit 1

      - name: Deploy to Staging (SSM)
        env:
          GH_TOKEN: ${{ github.token }}
          # Pulled by digest, never by the mutable staging-latest tag (daatan#1954).
          APP_IMAGE: ${{ env.ECR_REGISTRY }}/daatan-app@${{ needs.build-app-image.outputs.digest }}
          MIGRATIONS_IMAGE: ${{ env.ECR_REGISTRY }}/daatan-app@${{ needs.build-migrations-image.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          # Get Instance ID
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=staging" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "Found Staging Instance: $INSTANCE_ID"

          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          DEPLOY_FILES="scripts/blue-green-deploy.sh scripts/cleanup-docker-images.sh scripts/fetch-secrets.sh scripts/verify-health.sh scripts/verify-logs.sh scripts/verify-deploy.sh docker-compose.staging.yml infra/nginx/nginx-staging-ssl.conf"

          echo "🚀 Sending SSM Command..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Deploy Staging ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters commands='[
              "set -e",
              "export HOME=/home/ubuntu",
              "export PATH=$PATH:/usr/local/bin:/usr/bin",
              "",
              "echo \"📦 Downloading deploy files from GitHub...\"",
              "mkdir -p ~/app/scripts ~/app/infra/nginx",
              "cd ~/app",
              "for f in '"$DEPLOY_FILES"'; do curl -sfL -H \"Authorization: token '"$GH_TOKEN"'\" \"'"$RAW_BASE"'/$f\" -o \"$f\" || { echo \"  ❌ Download failed: $f\"; exit 1; }; done; echo \"  ✅ All deploy files downloaded\"",
              "chmod +x scripts/*.sh",
              "",
              "echo \"🔄 Testing and reloading nginx config...\"",
              "docker exec daatan-nginx nginx -t && docker exec daatan-nginx nginx -s reload || true",
              "",
              "echo \"🔐 Logging in to ECR (Region: eu-central-1)...\"",
              "aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "",
              "echo \"🧹 Pruning old Docker images before pull...\"",
              "./scripts/cleanup-docker-images.sh 3 || echo \"  ⚠️ Cleanup failed (non-fatal, continuing)\"",
              "",
              "echo \"⬇️ Pulling staging image ('"$APP_IMAGE"')...\"",
              "docker pull '"$APP_IMAGE"'",
              "",
              "echo \"🏷️ Tagging image...\"",
              "docker tag '"$APP_IMAGE"' daatan-app:staging-latest",
              "",
              "echo \"⬇️ Pulling migrations image...\"",
              "docker pull '"$MIGRATIONS_IMAGE"'",
              "docker tag '"$MIGRATIONS_IMAGE"' daatan-migrations:staging-latest",
              "",
              "echo \"🚀 Executing blue-green deployment...\"",
              "export GIT_COMMIT='"${{ github.sha }}"'",
              "export EXPECTED_VERSION='"$EXPECTED_VERSION"'",
              "export SKIP_BUILD=true",
              "./scripts/blue-green-deploy.sh staging"
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait and verify staging deployment
        uses: ./.github/actions/ssm-deploy
        with:
          command-id: ${{ env.COMMAND_ID }}
          health-url: https://staging.daatan.com
          app-version: ${{ needs.build.outputs.app_version }}

      - name: Get merged PR info
        id: pr_info
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq 'if length > 0 then .[0] | "#\(.number) \(.title)|\(.html_url)" else "" end' 2>/dev/null || echo "")
          if [ -n "$DATA" ]; then
            echo "label=$(echo "$DATA" | cut -d'|' -f1)" >> "$GITHUB_OUTPUT"
            echo "url=$(echo "$DATA" | cut -d'|' -f2)" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "label=commit $SHORT" >> "$GITHUB_OUTPUT"
            echo "url=https://github.com/${{ github.repository }}/commit/${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram - Staging Deployment Success
        if: success()
        env:
          MSG: |-
            ✅ [staging] Deployment successful

            v${{ needs.build.outputs.app_version }} · ${{ steps.pr_info.outputs.label }}

            <a href="${{ steps.pr_info.outputs.url }}">View changes →</a>
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"

      - name: Notify Telegram - Staging Deployment Failure
        if: failure()
        env:
          MSG: |-
            ❌ [staging] Deployment failed

            v${{ needs.build.outputs.app_version }} · ${{ steps.pr_info.outputs.label }}

            <a href="${{ steps.pr_info.outputs.url }}">View changes →</a> · <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs →</a>
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"

  # Resolve which image a production deploy ships. A `v*` tag never rebuilds
  # (daatan#1954): it waits for this commit's main-branch staging deploy to
  # succeed, then promotes the exact digest that deploy ran. A manual production
  # dispatch must name an existing version.
  resolve-release:
    name: Resolve Release Image
    needs: build
    if: |
      always() &&
      needs.build.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_digest: ${{ steps.digests.outputs.app }}
      migrations_digest: ${{ steps.digests.outputs.migrations }}
    steps:
      - name: Get version from tag or input
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Need a release version X.Y.Z (tag v<version>, or the 'version' input on a production dispatch); got '${VERSION}'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for this commit's staging deploy
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tagged commit must have gone through the main-branch pipeline and
          # been deployed to staging successfully. Polls while that run is still
          # going (a tag is usually pushed right after the merge).
          for i in $(seq 1 60); do
            RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main" \
              --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
            if [[ -n "$RUN_ID" ]]; then
              JOB=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.name == "Deploy to Staging") | "\(.status) \(.conclusion)"')
              RUN_STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .status)
              echo "main run $RUN_ID ($RUN_STATUS): Deploy to Staging = ${JOB:-not started} ($i/60)"
              case "$JOB" in
                "completed success")
                  echo "✅ ${GITHUB_SHA::7} is deployed to staging."
                  exit 0 ;;
                completed*)
                  echo "::error::The staging deploy for ${GITHUB_SHA::7} did not succeed ($JOB) — see run $RUN_ID. A newer merge may have superseded it; tag the current main HEAD instead."
                  exit 1 ;;
              esac
              if [[ "$RUN_STATUS" == "completed" && -z "$JOB" ]]; then
                echo "::error::Main run $RUN_ID finished without a staging deploy for ${GITHUB_SHA::7}. Tag the current main HEAD instead."
                exit 1
              fi
            else
              echo "No main-branch run for ${GITHUB_SHA::7} yet ($i/60)"
            fi
            sleep 30
          done
          echo "::error::Timed out after 30 min waiting for the staging deploy of ${GITHUB_SHA::7}. Only commits merged to main can be released."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Resolve image digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest() {
            aws ecr batch-get-image --repository-name daatan-app --image-ids "imageTag=$1" \
              --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.docker.distribution.manifest.list.v2+json \
                application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0].imageId.imageDigest' --output text
          }
          APP=$(digest "$VERSION")
          MIG=$(digest "${VERSION}-migrations")
          echo "daatan-app:$VERSION → $APP"
          echo "daatan-app:${VERSION}-migrations → $MIG"
          if [[ "$APP" != sha256:* || "$MIG" != sha256:* ]]; then
            echo "::error::No image for version $VERSION in ECR (main builds push it from package.json's version)."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The version tag must be the image built from this very commit: a tag
            # whose name differs from package.json, or a version tag later
            # overwritten by another commit, would otherwise ship something else.
            SHA_APP=$(digest "sha-${GITHUB_SHA::7}")
            SHA_MIG=$(digest "sha-${GITHUB_SHA::7}-migrations")
            if [[ "$APP" != "$SHA_APP" || "$MIG" != "$SHA_MIG" ]]; then
              echo "::error::daatan-app:$VERSION is not the image built from ${GITHUB_SHA::7} (sha tag → app $SHA_APP, migrations $SHA_MIG). Does the tag match package.json's version at that commit?"
              exit 1
            fi
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "migrations=$MIG" >> "$GITHUB_OUTPUT"

  # Deploy to PRODUCTION (on tag push only)
  deploy-production:
    name: Deploy to Production
    needs: [resolve-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    if: |
      always() &&
      needs.resolve-release.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Check Instance SSM Health
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=prod" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)

          echo "Instance $INSTANCE_ID PingStatus: $PING_STATUS"
          if [[ "$PING_STATUS" != "Online" ]]; then
            echo "❌ Error: Instance is $PING_STATUS. SSM command will fail. Please check or reboot the instance."
            exit 1
          fi

      - name: Deploy to Production (SSM)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          APP_IMAGE: ${{ env.ECR_REGISTRY }}/daatan-app@${{ needs.resolve-release.outputs.app_digest }}
          MIGRATIONS_IMAGE: ${{ env.ECR_REGISTRY }}/daatan-app@${{ needs.resolve-release.outputs.migrations_digest }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=prod" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "Found Production Instance: $INSTANCE_ID"
          echo "Deploying $VERSION: $APP_IMAGE"

          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          DEPLOY_FILES="scripts/blue-green-deploy.sh scripts/cleanup-docker-images.sh scripts/fetch-secrets.sh scripts/verify-health.sh scripts/verify-logs.sh scripts/verify-deploy.sh docker-compose.prod.yml infra/nginx/nginx-prod-ssl.conf"

          echo "🚀 Sending SSM Command..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Deploy Production $VERSION" \
            --timeout-seconds 600 \
            --parameters commands='[
              "set -e",
              "export HOME=/home/ubuntu",
              "export PATH=$PATH:/usr/local/bin:/usr/bin",
              "",
              "echo \"📦 Downloading deploy files from GitHub...\"",
              "mkdir -p ~/app/scripts ~/app/infra/nginx",
              "cd ~/app",
              "for f in '"$DEPLOY_FILES"'; do curl -sfL -H \"Authorization: token '"$GH_TOKEN"'\" \"'"$RAW_BASE"'/$f\" -o \"$f\" || { echo \"  ❌ Download failed: $f\"; exit 1; }; done; echo \"  ✅ All deploy files downloaded\"",
              "chmod +x scripts/*.sh",
              "",
              "echo \"🔄 Testing and reloading nginx config...\"",
              "cp infra/nginx/nginx-prod-ssl.conf nginx-ssl.conf || true",
              "docker exec daatan-nginx nginx -t && docker exec daatan-nginx nginx -s reload || true",
              "",
              "echo \"🔐 Logging in to ECR (Region: eu-central-1)...\"",
              "aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "",
              "echo \"🧹 Pruning old Docker images before pull...\"",
              "./scripts/cleanup-docker-images.sh 3 || echo \"  ⚠️ Cleanup failed (non-fatal, continuing)\"",
              "",
              "echo \"⬇️ Pulling production image ('"$APP_IMAGE"')...\"",
              "docker pull '"$APP_IMAGE"'",
              "",
              "echo \"🏷️ Tagging image as latest...\"",
              "docker tag '"$APP_IMAGE"' daatan-app:latest",
              "",
              "echo \"⬇️ Pulling migrations image...\"",
              "docker pull '"$MIGRATIONS_IMAGE"'",
              "docker tag '"$MIGRATIONS_IMAGE"' daatan-migrations:latest",
              "",
              "echo \"🚀 Executing blue-green deployment...\"",
              "export GIT_COMMIT='"${{ github.sha }}"'",
              "export EXPECTED_VERSION='"$VERSION"'",
              "export SKIP_BUILD=true",
              "./scripts/blue-green-deploy.sh production"
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait and verify production deployment
        uses: ./.github/actions/ssm-deploy
        with:
          command-id: ${{ env.COMMAND_ID }}
          health-url: https://daatan.com
          app-version: ${{ needs.resolve-release.outputs.version }}

      - name: Get merged PR info
        id: pr_info
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq 'if length > 0 then .[0] | "#\(.number) \(.title)|\(.html_url)" else "" end' 2>/dev/null || echo "")
          if [ -n "$DATA" ]; then
            echo "label=$(echo "$DATA" | cut -d'|' -f1)" >> "$GITHUB_OUTPUT"
            echo "url=$(echo "$DATA" | cut -d'|' -f2)" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "label=commit $SHORT" >> "$GITHUB_OUTPUT"
            echo "url=https://github.com/${{ github.repository }}/commit/${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram - Production Deployment Success
        if: success()
        env:
          MSG: |-
            ✅ [prod] Deployment successful

            v${{ needs.resolve-release.outputs.version }} · ${{ steps.pr_info.outputs.label }}

            <a href="${{ steps.pr_info.outputs.url }}">View changes →</a>
        run: |
          CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
          CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MSG" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"

      - name: Notify Telegram - Production Deployment Failure
        if: failure()
        env:
          MSG: |-
            ❌ [prod] Deployment failed

            v${{ needs.resolve-release.outputs.version }} · ${{ steps.pr_info.outputs.label }}

            <a href="${{ steps.pr_info.outputs.url }}">View changes →</a> · <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs →</a>
        run: |
          CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
          CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MSG" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"