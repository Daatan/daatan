name: Android release build

# Builds and signs the Android App Bundle (AAB) for the Play Store TWA wrapper
# (android/twa-manifest.json) and, when a Play service account is configured,
# uploads it to a Play track. Decoupled from the web app's own `v*` tags: a web
# deploy is instant, an Android release goes through Play review.
#
# Triggers
#   pull_request (android/**)   build + verify only, never uploads (same-repo PRs only: needs the keystore)
#   push to main (android/**)   build + upload to the internal track
#   push tag android-v*         build + upload to the internal track, versionName taken from the tag
#   schedule (monthly)          rebuild + upload to internal so toolchain rot (SDK, runner image) shows up early
#   workflow_dispatch           pick a testing track (internal/alpha/beta), status and release notes by hand
#
# Promotion to production is deliberately a human step in the Play Console; this workflow only uploads to
# testing tracks. Uploading needs the repo secret PLAY_SERVICE_ACCOUNT_JSON; without it the job still builds and
# keeps the AAB as an artifact, and says so in the summary. See android/README.md for the one-time setup.
# Secrets are scoped to the steps that need them: the keystore to its decode step, the keystore passwords to the
# build step, the Play service account to the upload step (plus a presence probe that never prints it).
#
# versionCode/versionName are derived here, not committed: Play rejects a duplicate versionCode and
# `--skipVersionUpgrade` below keeps whatever the manifest says. Only android/twa-manifest.json is committed --
# `bubblewrap update` regenerates the full Gradle project from it every run.

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
    tags:
      - 'android-v*'
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to'
        type: choice
        options: [internal, alpha, beta]
        default: internal
      status:
        description: 'Release status (draft = prepare it, finish in Play Console)'
        type: choice
        options: [completed, draft]
        default: completed
      release_notes:
        description: 'Release notes (en-US, max 500 chars; empty = default text)'
        type: string
        default: ''

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # Google's current minimum target API for updates (Play policy: Android 16 = API 36, enforced 2026-08-31).
  # Raise this when the policy does; the build fails before upload if the generated project targets less.
  MIN_TARGET_SDK: '36'
  PACKAGE_NAME: com.daatan.app
  # Exact Bubblewrap CLI version; bump by PR (the target-API floor check below catches a template that lags).
  BUBBLEWRAP_VERSION: '1.27.0'
  # Matches MIN_TARGET_SDK; apksigner for the signature check comes from here.
  BUILD_TOOLS_VERSION: '36.0.0'
  # SHA-256 of the upload key the CI keystore signs with -- the first entry of public/.well-known/assetlinks.json
  # (see android/README.md, "Digital Asset Links"). Play re-signs distributed APKs with its own app signing key,
  # so that one is not expected here. The build fails if the artifacts are signed with anything else.
  UPLOAD_KEY_SHA256: '1B:79:A3:BC:73:B1:E0:DF:DC:45:2C:F4:84:F5:77:6C:1E:65:B0:D5:54:D4:44:F8:21:2B:9B:D5:4E:33:CF:18'

jobs:
  build:
    name: Build signed AAB (and upload to Play when configured)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A fork PR has no access to the keystore secret, so it cannot build a signed bundle.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for Play upload credentials
        id: playcfg
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default `tools` package no longer exists in the SDK repository.
          packages: ''

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-${MIN_TARGET_SDK}" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Point Bubblewrap at the JDK/Android SDK non-interactively
        run: |
          # Bubblewrap's own JDK auto-download fetches the openjdk/jdk17u
          # SOURCE repo zip (not a binary build) and crashes -- always point
          # it at a real JDK/SDK instead of letting it prompt (it will hang
          # in CI with no stdin). ~/.bubblewrap/config.json short-circuits
          # that prompt entirely.
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json
          # Bubblewrap's SDK path validator only accepts a `tools/` or
          # `bin/` directory directly under the SDK root (the old
          # standalone-sdkmanager layout); modern SDKs nest cmdline-tools
          # under cmdline-tools/latest/. This symlink satisfies the check
          # without altering the real SDK layout.
          ln -sf "${ANDROID_HOME}/cmdline-tools/latest/bin" "${ANDROID_HOME}/bin"

      - name: Derive version
        id: version
        run: |
          # Minutes since the epoch: strictly increasing, unique per build, no state to keep, well under
          # Play's 2.1e9 ceiling (about 29.6M today).
          CODE=$(( $(date +%s) / 60 ))
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF_NAME#android-v}"
          else
            # Untagged builds continue from the highest android-vX.Y.Z tag: X.Y.(Z + run number). That never reads
            # lower than the last tagged release, and with android-v1.0.0 it is the same 1.0.N as before.
            BASE=$(git ls-remote --tags --refs origin 'refs/tags/android-v*' \
              | sed -nE 's#.*refs/tags/android-v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -1)
            BASE=${BASE:-1.0.0}
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            NAME="${MAJOR}.${MINOR}.$(( PATCH + GITHUB_RUN_NUMBER ))"
            echo "Last android-v* tag: android-v${BASE}"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

      - name: Stamp version into the manifest
        working-directory: android
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          jq --argjson code "$CODE" --arg name "$NAME" \
            '.appVersionCode = $code | .appVersionName = $name | .appVersion = $name' \
            twa-manifest.json > twa-manifest.json.new
          mv twa-manifest.json.new twa-manifest.json

      - name: Decode upload keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Generate Gradle project non-interactively
        working-directory: android
        run: |
          # `bubblewrap build` prompts "No checksum file was found... would
          # you like to regenerate your project? (Y/n)" whenever
          # manifest-checksum.txt is absent -- which it always is here,
          # since only twa-manifest.json is committed. There's no stdin in
          # CI, so that prompt kills the job (exit 130). Running `update`
          # first (with --skipVersionUpgrade, since without it bubblewrap
          # auto-bumps appVersionCode and prompts for a new appVersionName
          # whenever it doesn't already match the version code scheme)
          # generates the project + checksum file up front, so the
          # subsequent `build` finds a matching checksum and never prompts.
          npx --yes "@bubblewrap/cli@${BUBBLEWRAP_VERSION}" update --skipVersionUpgrade

      - name: Verify the generated project meets the target API floor
        id: target
        working-directory: android
        run: |
          TARGET=$(grep -E '^\s*targetSdkVersion\s+[0-9]+' app/build.gradle | head -1 | grep -oE '[0-9]+')
          echo "targetSdkVersion=${TARGET:-unknown} (floor ${MIN_TARGET_SDK})"
          echo "sdk=${TARGET:-unknown}" >> "$GITHUB_OUTPUT"
          if [ -z "$TARGET" ] || [ "$TARGET" -lt "$MIN_TARGET_SDK" ]; then
            echo "::error::Generated project targets API ${TARGET:-unknown}, Google Play requires >= ${MIN_TARGET_SDK}. Bump BUBBLEWRAP_VERSION or raise targetSdkVersion."
            exit 1
          fi

      - name: Build signed AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx --yes "@bubblewrap/cli@${BUBBLEWRAP_VERSION}" build

      - name: Clean up keystore
        if: always()
        working-directory: android
        run: rm -f android.keystore

      - name: Verify artifact signatures
        run: |
          export APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          scripts/verify-android-signature.sh "$UPLOAD_KEY_SHA256" \
            android/app-release-signed.apk android/app-release-bundle.aab \
            public/.well-known/assetlinks.json

      - name: Upload AAB + APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: daatan-android-${{ steps.version.outputs.name }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 90

      - name: Write release notes
        env:
          NOTES: ${{ inputs.release_notes }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          # Play shows these per language; it carries them over when a release is promoted in the Console.
          mkdir -p android/whatsnew
          printf '%s' "${NOTES:-DAATAN ${NAME}: bug fixes and improvements.}" | head -c 500 > android/whatsnew/whatsnew-en-US
          cat android/whatsnew/whatsnew-en-US; echo

      - name: Upload to Google Play
        id: play
        if: github.event_name != 'pull_request' && steps.playcfg.outputs.configured == 'true'
        # r0adkll/upload-google-play v1.1.5, pinned to the commit
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app-release-bundle.aab
          whatsNewDirectory: android/whatsnew
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      - name: Summary
        if: always()
        env:
          PLAY_CONFIGURED: ${{ steps.playcfg.outputs.configured }}
          PLAY_OUTCOME: ${{ steps.play.outcome }}
          TRACK: ${{ inputs.track || 'internal' }}
        run: |
          {
            echo "### Android build: versionName ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})"
            echo ""
            echo "- targetSdkVersion: \`${{ steps.target.outputs.sdk }}\` (floor ${MIN_TARGET_SDK})"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- Pull request: build verified, nothing uploaded."
            elif [ "$PLAY_CONFIGURED" = "true" ]; then
              echo "- Play upload to \`$TRACK\`: ${PLAY_OUTCOME}"
            else
              echo "- **Not uploaded**: repo secret \`PLAY_SERVICE_ACCOUNT_JSON\` is not set. Download the artifact and upload the AAB by hand, or see android/README.md to enable automatic uploads."
            fi
            echo "- Production promotion is manual, in the Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
