name: Android release build

# Builds and signs the Android App Bundle (AAB) for the Play Store TWA
# wrapper (android/twa-manifest.json). Deliberately decoupled from the web
# app's own `v*` tags -- a web deploy is instant/no-review, an Android
# release is a distinct, occasional event.
#
# Downloadable GitHub Actions artifact ONLY -- no auto-upload to Play
# Console (that needs a separate Google Cloud service account + Play
# Developer API grant, explicitly out of scope for v1: release should be
# simple and explicit). Upload the artifact to Play Console by hand.
#
# Only android/twa-manifest.json is committed -- `bubblewrap build`
# regenerates the full Gradle project fresh from it every run.

on:
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0"

      - name: Point Bubblewrap at the JDK/Android SDK non-interactively
        run: |
          # Bubblewrap's own JDK auto-download fetches the openjdk/jdk17u
          # SOURCE repo zip (not a binary build) and crashes -- always point
          # it at a real JDK/SDK instead of letting it prompt (it will hang
          # in CI with no stdin). ~/.bubblewrap/config.json short-circuits
          # that prompt entirely.
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json
          # Bubblewrap's SDK path validator only accepts a `tools/` or
          # `bin/` directory directly under the SDK root (the old
          # standalone-sdkmanager layout); modern SDKs nest cmdline-tools
          # under cmdline-tools/latest/. This symlink satisfies the check
          # without altering the real SDK layout.
          ln -sf "${ANDROID_HOME}/cmdline-tools/latest/bin" "${ANDROID_HOME}/bin"

      - name: Decode upload keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Generate Gradle project non-interactively
        working-directory: android
        run: |
          # `bubblewrap build` prompts "No checksum file was found... would
          # you like to regenerate your project? (Y/n)" whenever
          # manifest-checksum.txt is absent -- which it always is here,
          # since only twa-manifest.json is committed. There's no stdin in
          # CI, so that prompt kills the job (exit 130). Running `update`
          # first (with --skipVersionUpgrade, since without it bubblewrap
          # auto-bumps appVersionCode and prompts for a new appVersionName
          # whenever it doesn't already match the version code scheme)
          # generates the project + checksum file up front, so the
          # subsequent `build` finds a matching checksum and never prompts.
          npx --yes @bubblewrap/cli update --skipVersionUpgrade

      - name: Build signed AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx --yes @bubblewrap/cli build

      - name: Clean up keystore
        if: always()
        working-directory: android
        run: rm -f android.keystore

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: daatan-android-${{ github.ref_name }}
          path: android/app-release-bundle.aab
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### Android release build: ${{ github.ref_name }}"
            echo ""
            echo "Signed AAB built and attached to this run as \`daatan-android-${{ github.ref_name }}\`."
            echo ""
            echo "**This is a downloadable artifact only -- nothing was uploaded to Play"
            echo "Console.** Download it and upload it by hand to the appropriate track"
            echo "(internal testing first). See \`android/README.md\` for the full process."
          } >> "$GITHUB_STEP_SUMMARY"
