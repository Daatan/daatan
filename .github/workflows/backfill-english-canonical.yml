name: Backfill English Canonical

# Canonicalizes non-English forecasts to English (translate → re-slug, keeping the
# old slug as a 308 alias, and seeding the original wording as a translation). Drives
# the admin route POST /api/admin/forecasts/backfill-english-canonical in bounded
# rounds until `remaining` reaches 0. Auth is the x-cron-secret (BOT_RUNNER_SECRET)
# header, same as the cron routes — the secret only ever lives in the Actions runner.
#
# Manual, on-demand: Actions → Backfill English Canonical → Run workflow.
# Run against staging first to eyeball the slug/claim changes before production.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to backfill
        type: choice
        options: [staging, production]
        default: staging
      limit:
        description: Forecasts per round (each is multiple Gemini calls — keep small)
        default: '2'
      max_rounds:
        description: Safety cap on rounds
        default: '100'

jobs:
  backfill:
    name: Backfill ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Drive backfill until drained
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            BASE="https://daatan.com"
          else
            BASE="$STAGING_URL"
          fi
          if [ -z "$BASE" ]; then echo "❌ No URL configured for ${{ inputs.target }}"; exit 1; fi
          echo "Target: $BASE (limit=${{ inputs.limit }}/round, up to ${{ inputs.max_rounds }} rounds)"

          # Every round marks each forecast it touches (original_language set), so
          # `remaining` strictly decreases and the loop converges. A `failed` row
          # (detection error) is left for a later re-run. A slow/timed-out round is
          # transient — log and retry, don't abort.
          errstreak=0
          for i in $(seq 1 ${{ inputs.max_rounds }}); do
            BODY=$(curl -s --max-time 180 -X POST \
              -H "x-cron-secret: $BOT_RUNNER_SECRET" \
              "$BASE/api/admin/forecasts/backfill-english-canonical?limit=${{ inputs.limit }}") || BODY=""
            echo "round $i: ${BODY:-<no response>}"

            REMAINING=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('remaining','ERR'))" 2>/dev/null || echo ERR)
            if [ "$REMAINING" = "0" ]; then
              echo "✅ Drained — every non-English forecast is now English-canonical"
              exit 0
            fi
            if [ "$REMAINING" = "ERR" ]; then
              errstreak=$((errstreak + 1))
              echo "round $i: no/invalid response (transient) — streak $errstreak"
              if [ "$errstreak" -ge 5 ]; then
                echo "❌ 5 consecutive bad responses — likely auth/server error, aborting"
                exit 1
              fi
              sleep 8
              continue
            fi
            errstreak=0
            sleep 3
          done

          echo "⚠️ Hit max_rounds with $REMAINING still remaining — re-run to continue"
