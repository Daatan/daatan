name: Health Watchdog
#
# WHERE EACH JOB RUNS:
#
#   watchdog job (HTTP checks + version drift):
#     Runs on a GitHub Actions runner (ubuntu-latest cloud VM).
#     Makes HTTP requests to daatan.com / staging.daatan.com from GitHub's network.
#     Telegram alerts sent here originate FROM GitHub Actions, not from the server.
#     If GitHub Actions has an outage, this job stops silently.
#     → Complemented by heartbeat.yml: the EC2 app process sends its own daily
#       Telegram ping so you know the server is alive even if GH Actions is down.
#
#   disk-watchdog job (disk, CPU, memory):
#     Starts on a GitHub Actions runner, then issues AWS SSM commands to EC2.
#     The shell scripts (check-disk-space.sh, check-system-health.sh) EXECUTE ON
#     the EC2 instance. Telegram alerts from those scripts are sent FROM the server
#     using the TELEGRAM_BOT_TOKEN in the server's .env file — independent of GH.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    name: Check ${{ matrix.env.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: production
            base_url: https://daatan.com
          - name: staging
            base_url: https://staging.daatan.com

    steps:
      - name: Check pages
        id: checks
        run: |
          BASE="${{ matrix.env.base_url }}"
          FAILED=()
          MAX_ATTEMPTS=2
          RETRY_DELAY=10

          check() {
            local label="$1" url="$2" expect_key="${3:-}" expect_val="${4:-}"
            local attempt REASON

            # Retries once (after RETRY_DELAY) before recording a failure — a
            # single transient network blip between the runner and the target
            # (2026-07-26 10:21 UTC: all 6 checks timed out for ~2 min with no
            # app restart, no nginx errors, and no gap in the SSM-side disk
            # check) shouldn't page the clean channel. A real outage still
            # fails both attempts.
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              echo "Checking $label -> $url (attempt $attempt/$MAX_ATTEMPTS)"

              # -w format: http_code then num_redirects on separate lines.
              # NOTE: no leading \n — body goes to file so stdout is only the -w trailer.
              # head -1 = http_code, tail -1 = num_redirects.
              #
              # Capture curl's REAL exit code. The previous form `curl ... ) || true`
              # followed by `CURL_EXIT=$?` was broken: `$?` then read the exit of
              # `true` (always 0), so the curl-error branch below was dead code. On
              # the 2026-06-20 cert-expiry outage curl exited 60, was treated as a
              # success, then `cat` on the never-written body file aborted the step
              # under `bash -e` before `failed=true` was set — so the Telegram alert
              # silently skipped for ~18h. `cmd || CURL_EXIT=$?` keeps `$?` pointing
              # at curl while still not tripping `bash -e`.
              rm -f /tmp/curl_body.txt /tmp/curl_err.txt
              CURL_EXIT=0
              HTTP_AND_REDIRECTS=$(curl -L --max-redirs 5 --max-time 15 \
                -w "%{http_code}\n%{num_redirects}" \
                -o /tmp/curl_body.txt \
                "$url" 2>/tmp/curl_err.txt) || CURL_EXIT=$?

              # curl non-zero exit: map common codes to human-readable reasons
              if [ $CURL_EXIT -ne 0 ]; then
                ERR=$(head -1 /tmp/curl_err.txt)
                case $CURL_EXIT in
                  6)  REASON="DNS resolution failed" ;;
                  7)  REASON="connection refused" ;;
                  28) REASON="timed out (>15s)" ;;
                  35) REASON="SSL/TLS handshake failed" ;;
                  60) REASON="SSL certificate problem (expired/invalid)" ;;
                  47) REASON="too many redirects" ;;
                  *)  REASON="curl error $CURL_EXIT" ;;
                esac
                echo "  FAIL $REASON: $ERR"
              else
                HTTP=$(echo "$HTTP_AND_REDIRECTS" | head -1)
                NUM_REDIRECTS=$(echo "$HTTP_AND_REDIRECTS" | tail -1)
                BODY=$(cat /tmp/curl_body.txt 2>/dev/null || true)

                # Any redirect from a canonical HTTPS URL is suspicious — flag it.
                # If we followed redirects and the final status is OK, that masks loops
                # like the 307-loop incident. Treat any redirect as a failure.
                if [ "$NUM_REDIRECTS" -gt 0 ]; then
                  echo "  FAIL unexpected redirect(s) (count: $NUM_REDIRECTS, final HTTP $HTTP)"
                  echo "  These URLs should be canonical HTTPS — any redirect indicates misconfiguration"
                  REASON="$NUM_REDIRECTS redirect(s) — possible loop"
                elif [[ "$HTTP" -lt 200 || "$HTTP" -ge 400 ]]; then
                  SNIPPET=$(echo "$BODY" | head -c 120 | tr '\n' ' ')
                  echo "  FAIL HTTP $HTTP — $SNIPPET"
                  REASON="HTTP $HTTP"
                elif [[ -n "$expect_key" ]] && ! echo "$BODY" | grep -qE "\"$expect_key\":(\"$expect_val\"|$expect_val)"; then
                  SNIPPET=$(echo "$BODY" | head -c 200 | tr '\n' ' ')
                  echo "  FAIL expected $expect_key=$expect_val — got: $SNIPPET"
                  REASON="$expect_key≠$expect_val"
                else
                  echo "  OK (HTTP $HTTP)"
                  return
                fi
              fi

              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "  RETRY $label in ${RETRY_DELAY}s (attempt $attempt/$MAX_ATTEMPTS failed: $REASON)"
                sleep "$RETRY_DELAY"
              fi
            done

            FAILED+=("$label ($REASON)")
          }

          # API health + DB
          check "Health (app+db)" "$BASE/api/health" "status" "ok"
          check "Health DB flag"  "$BASE/api/health" "db" "true"

          # Public pages
          check "Homepage"      "$BASE"             ""
          check "Forecast feed" "$BASE/forecasts"   ""
          check "Leaderboard"   "$BASE/leaderboard" ""
          check "About/login"   "$BASE/auth/signin" ""

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            # Join with | so Telegram step can format as separate lines
            FAILURE_STR=$(printf '%s|' "${FAILED[@]}")
            echo "failures=${FAILURE_STR%|}" >> "$GITHUB_OUTPUT"
            printf '  FAIL %s\n' "${FAILED[@]}"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert via Telegram
        if: steps.checks.outputs.failed == 'true'
        run: |
          ENV="${{ matrix.env.name }}"
          FAILURES="${{ steps.checks.outputs.failures }}"
          # Format | -separated failures as a bullet list (| → %0A• )
          FAILURE_LINES=$(echo "$FAILURES" | sed 's/|/%0A• /g')
          # Prod health-check failure → clean channel; staging stays noisy
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ "$ENV" = "production" ]; then
            CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
            CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          fi
          MSG="🚨 <b>[$ENV] Health check FAILED</b>%0A%0A• ${FAILURE_LINES}%0A%0A<a href='${{ matrix.env.base_url }}/api/health'>View health endpoint</a>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # Runs after the alert so a real failure still pages before the job goes
      # red. Without this, "Check pages" never exits non-zero, so the job
      # conclusion always showed success even when the alert above fired.
      - name: Fail job on check failure
        if: steps.checks.outputs.failed == 'true'
        run: exit 1

      # Advisory-only: detect when production is running a version older than staging.
      # Notifies at most once per production version — subsequent watchdog runs skip
      # the alert until prod itself advances, regardless of how many times staging bumps.
      - name: Restore version-drift notification cache
        if: always() && matrix.env.name == 'production'
        id: drift-cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/drift-notified
          key: version-drift-notified-${{ hashFiles('/tmp/drift-key.txt') }}
          restore-keys: version-drift-notified-

      - name: Check version drift (prod vs staging)
        if: always() && matrix.env.name == 'production'
        id: drift
        run: |
          # Helper: convert semver to a zero-padded integer for numeric comparison.
          # e.g. "1.7.140" -> "001007140"
          ver() { echo "$@" | awk -F. '{ printf("%d%03d%03d\n", $1,$2,$3); }'; }

          PROD_HEALTH=$(curl -s --max-time 5 "https://daatan.com/api/health" 2>/dev/null || echo "")
          STAGING_HEALTH=$(curl -s --max-time 5 "https://staging.daatan.com/api/health" 2>/dev/null || echo "")

          PROD_VER=$(echo "$PROD_HEALTH" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          STAGING_VER=$(echo "$STAGING_HEALTH" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)

          if [ -z "$STAGING_VER" ]; then
            echo "Staging unreachable or version not found — skipping drift check"
            exit 0
          fi

          if [ -z "$PROD_VER" ]; then
            echo "Production version not found — skipping drift check"
            exit 0
          fi

          echo "Production version : $PROD_VER"
          echo "Staging version    : $STAGING_VER"

          # Cache key is keyed on prod version only — once alerted for a given prod
          # version, no further alerts fire until prod itself deploys a newer build.
          DRIFT_KEY="prod-${PROD_VER}"
          echo "$DRIFT_KEY" > /tmp/drift-key.txt

          if [ "$(ver "$STAGING_VER")" -gt "$(ver "$PROD_VER")" ]; then
            echo "Version drift detected: staging ($STAGING_VER) > production ($PROD_VER)"

            CACHED_KEY=$(cat /tmp/drift-notified 2>/dev/null || echo "")
            if [ "$CACHED_KEY" = "$DRIFT_KEY" ]; then
              echo "Already notified for this drift — skipping Telegram alert"
            else
              MSG="⚠️ [prod] Version drift: prod is running v$PROD_VER but staging has v$STAGING_VER — consider deploying to production"
              # Low-signal advisory → noisy channel only. The clean channel is
              # reserved for high-signal events; drift is a routine "deploy me" nudge.
              DRIFT_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d "chat_id=$DRIFT_CHAT_ID" \
                -d "text=$MSG" \
                -d "parse_mode=HTML" \
                -d "disable_web_page_preview=true"
              echo "$DRIFT_KEY" > /tmp/drift-notified
              echo "save_cache=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No version drift — production is up to date"
          fi

      - name: Save version-drift notification cache
        if: always() && matrix.env.name == 'production' && steps.drift.outputs.save_cache == 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/drift-notified
          key: version-drift-notified-${{ hashFiles('/tmp/drift-key.txt') }}

  disk-watchdog:
    name: Disk Check ${{ matrix.env.name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: production
            tag: prod
          - name: staging
            tag: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Run Disk Check via SSM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=${{ matrix.env.tag }}" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "⚠️ No instance found for ${{ matrix.env.name }}"
            exit 0
          fi

          echo "Found Instance: $INSTANCE_ID"

          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Disk Check ${{ matrix.env.name }}" \
            --parameters commands='[
              "set -e",
              "mkdir -p ~/app/scripts",
              "cd ~/app",
              "curl -sfL -H \"Authorization: token '"$GH_TOKEN"'\" \"'"$RAW_BASE"'/scripts/check-disk-space.sh\" -o \"scripts/check-disk-space.sh\"",
              "chmod +x scripts/check-disk-space.sh",
              "./scripts/check-disk-space.sh '"${{ matrix.env.name }}"'"
            ]' \
            --output text

      - name: Run System Health Check via SSM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=${{ matrix.env.tag }}" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "⚠️ No instance found for ${{ matrix.env.name }}"
            exit 0
          fi

          echo "Found Instance: $INSTANCE_ID"

          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "System Health Check ${{ matrix.env.name }}" \
            --parameters commands='[
              "set -e",
              "mkdir -p ~/app/scripts",
              "cd ~/app",
              "curl -sfL -H \"Authorization: token '"$GH_TOKEN"'\" \"'"$RAW_BASE"'/scripts/check-system-health.sh\" -o \"scripts/check-system-health.sh\"",
              "chmod +x scripts/check-system-health.sh",
              "./scripts/check-system-health.sh '"${{ matrix.env.name }}"'"
            ]' \
            --output text

  # Polls CloudWatch alarms (prefix: daatan-) and posts to Telegram if any are
  # ALARM. Independent of SSM and the EC2 instance — so it still fires when the
  # SSM agent is dead, which is exactly the OOM state the existing
  # check-system-health.sh can't detect (because that script runs on the box
  # via SSM dispatch-without-await).
  metric-alarm-watchdog:
    name: CloudWatch Alarm Check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Check CloudWatch alarms in ALARM state
        id: alarms
        run: |
          # JSON array of currently-firing daatan-* alarms, with name +
          # description + state-reason. Empty array means nothing firing.
          FIRING=$(aws cloudwatch describe-alarms \
            --state-value ALARM \
            --alarm-name-prefix daatan- \
            --query 'MetricAlarms[*].{name:AlarmName,desc:AlarmDescription,reason:StateReason}' \
            --output json)
          COUNT=$(echo "$FIRING" | jq 'length')
          echo "Firing count: $COUNT"
          echo "$FIRING" | jq -r '.[] | "  - \(.name): \(.reason)"'
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # Newline-delimited so the Telegram step can format. Use base64 to
          # survive the GITHUB_OUTPUT format which doesn't tolerate newlines.
          echo "alarms_b64=$(echo "$FIRING" | jq -r '.[] | "• \(.name) — \(.reason)"' | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Alert via Telegram
        if: steps.alarms.outputs.count != '0'
        run: |
          ALARM_LINES=$(echo '${{ steps.alarms.outputs.alarms_b64 }}' | base64 -d)
          # Infra alarms firing → clean channel (fallback to noisy if unset)
          CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
          CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          MSG="🚨 <b>CloudWatch alarm(s) firing</b>%0A%0A$(echo "$ALARM_LINES" | sed 's/$/%0A/g' | tr -d '\n')"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
