name: Weekly SEO Report
#
# platform#13 — the measurement loop for the 2026-08 SEO initiative
# (elections#113-#121, daatan#1294-#1295). Posts a weekly GSC + Yandex
# snapshot for daatan.com and elections.daatan.com to the CLEAN Telegram
# channel (weekly cadence, direction-of-travel signal — page-worthy in the
# sense that someone should glance at it, unlike the daily cost digest).
#
# Credentials: GSC_SA_KEY is the same seo-mcp@daatan service account the
# local MCP tooling uses (added to both GSC properties 2026-08); YWM_OAUTH_TOKEN
# likewise mirrors the local Yandex.Webmaster token; CRUX_API_KEY is the
# pagespeed-mcp GCP API key, widened to also allow chromeuxreport.googleapis.com
# (daatan#1366). See scripts/seo-report.py for what is and isn't reachable via
# the APIs (coverage alerts are not).

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  seo-report:
    name: Send weekly SEO report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet google-api-python-client google-auth requests

      - name: Run report
        env:
          YWM_OAUTH_TOKEN: ${{ secrets.YWM_OAUTH_TOKEN }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo '${{ secrets.GSC_SA_KEY }}' > /tmp/gsc-sa.json
          export GSC_SA_KEY_FILE=/tmp/gsc-sa.json
          # Clean channel with noisy fallback — same runner pattern as backup.yml.
          CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
          export TELEGRAM_CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          python3 scripts/seo-report.py
