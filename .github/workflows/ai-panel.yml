name: AI Panel

# Twice-daily trigger for /api/cron/ai-panel — the multi-model estimate panel
# (docs/AI_PANEL.md). Each member answers an ungrounded prompt (claim + dates +
# resolution rules, no article text) and its probability is stored as an AiEstimate.
#
# WHERE THIS RUNS:
#   A GitHub Actions runner makes the HTTP request; the EC2 app process does the work
#   (OpenRouter calls → DB write). Same mechanism as external-market-sync.yml /
#   heartbeat.yml — not an EC2 crontab.
#
# WHY TWICE A DAY FOR A ONCE-A-DAY ANSWER:
#   The prompt's only changing input is the date, and the run is gated on a hash of
#   its inputs — so the second tick is a free no-op (no LLM calls, no writes) whenever
#   the first succeeded. It exists purely so a failed tick self-heals within 12h.
#
# DORMANT WITHOUT A KEY:
#   With no OpenRouter key configured (admin Settings → env), the sweep returns
#   {dormant: true} and does nothing. That is a 200, not a failure.

on:
  schedule:
    - cron: '43 4,16 * * *'   # 04:43 and 16:43 UTC (off the hour, off the requote cron at 05:31)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and log prompts only — write nothing, call no models'
        type: boolean
        default: false
      limit:
        description: 'Cap the number of forecasts (blank = all)'
        type: string
        default: ''

jobs:
  panel:
    name: Panel ${{ matrix.env.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: production
            url: https://daatan.com
          - name: staging

    steps:
      - name: Trigger AI panel sweep
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
        run: |
          ENV="${{ matrix.env.name }}"
          if [ "$ENV" = "staging" ]; then
            BASE="$STAGING_URL"
          else
            BASE="${{ matrix.env.url }}"
          fi

          if [ -z "$BASE" ]; then
            echo "⚠️ No URL configured for $ENV — skipping"
            exit 0
          fi

          QS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            QS="?dryRun=1"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            if [ -z "$QS" ]; then QS="?limit=${{ inputs.limit }}"; else QS="$QS&limit=${{ inputs.limit }}"; fi
          fi

          # The endpoint validates x-cron-secret against env.BOT_RUNNER_SECRET on the
          # server (src/app/api/cron/ai-panel/route.ts).
          HTTP=$(curl -s -o /tmp/panel_body.txt -w "%{http_code}" \
            --max-time 300 \
            -H "x-cron-secret: $BOT_RUNNER_SECRET" \
            "$BASE/api/cron/ai-panel$QS")

          BODY=$(cat /tmp/panel_body.txt)
          echo "HTTP $HTTP — $BODY"

          if [ "$HTTP" = "200" ]; then
            echo "✅ Panel sweep OK for $ENV"
          elif [ "$HTTP" = "404" ]; then
            # The route ships with v1.38.0+; until an env is deployed it 404s — not an error.
            echo "ℹ️ Route not deployed yet on $ENV (HTTP 404) — skipping"
          else
            echo "❌ Panel sweep failed for $ENV (HTTP $HTTP)"
            exit 1
          fi
