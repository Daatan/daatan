name: AI Panel

# Twice-daily trigger for /api/cron/ai-panel — the multi-model estimate panel
# (docs/LASSO.md). Each member answers an ungrounded prompt (claim + dates +
# resolution rules, no article text) and its probability is stored as an AiEstimate.
#
# WHERE THIS RUNS:
#   A GitHub Actions runner makes the HTTP request; the EC2 app process does the work
#   (OpenRouter calls → DB write). Same mechanism as external-market-sync.yml /
#   heartbeat.yml — not an EC2 crontab.
#
# WHY TWICE A DAY FOR A ONCE-A-DAY ANSWER:
#   The prompt's only changing input is the date, and the run is gated on a hash of
#   its inputs — so the second tick is a free no-op (no LLM calls, no writes) whenever
#   the first succeeded. It exists purely so a failed tick self-heals within 12h.
#
# KEY FAILURE MODES (docs/LASSO.md §9):
#   A missing OpenRouter key is NOT dormancy: the Bedrock member runs on the app's IAM
#   role, so the sweep proceeds with that member alone (dormant = no key AND no
#   non-OpenRouter member — unreachable with the current roster). A REJECTED key
#   (401/403) makes the route answer 502 even when Bedrock carried the sweep, which
#   fails this job — a dead credential must go red, not print a green no-op.

on:
  schedule:
    - cron: '43 4,16 * * *'   # 04:43 and 16:43 UTC (off the hour, off the requote cron at 05:31)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and log prompts only — write nothing, call no models'
        type: boolean
        default: false
      limit:
        description: 'Cap the number of forecasts (blank = all)'
        type: string
        default: ''

jobs:
  panel:
    name: Panel ${{ matrix.env.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: production
            url: https://daatan.com
          - name: staging

    steps:
      - name: Trigger AI panel sweep
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ENV="${{ matrix.env.name }}"
          if [ "$ENV" = "staging" ]; then
            BASE="$STAGING_URL"
          else
            BASE="${{ matrix.env.url }}"
          fi

          # A missing URL is a broken secret, not a reason to skip: a deleted
          # STAGING_URL must turn the job red, not silently switch off coverage.
          if [ -z "$BASE" ]; then
            echo "❌ No URL configured for $ENV"
            exit 1
          fi

          QS=""
          if [ "$DRY_RUN" = "true" ]; then
            QS="?dryRun=1"
          fi
          if [ -n "$LIMIT" ]; then
            if [ -z "$QS" ]; then QS="?limit=$LIMIT"; else QS="$QS&limit=$LIMIT"; fi
          fi

          # The endpoint validates x-cron-secret against env.BOT_RUNNER_SECRET on the
          # server (src/app/api/cron/ai-panel/route.ts).
          #
          # --max-time is a transport guard, NOT the sweep budget: route.ts's
          # maxDuration is inert on the self-hosted deployment, and a healthy
          # first-of-day sweep (sequential forecasts, 30s per-call timeout) can
          # legitimately run several minutes. 600s buys headroom without letting a
          # dead server hang the job.
          HTTP=$(curl -s -o /tmp/panel_body.txt -w "%{http_code}" \
            --max-time 600 \
            -H "x-cron-secret: $BOT_RUNNER_SECRET" \
            "$BASE/api/cron/ai-panel$QS")

          BODY=$(cat /tmp/panel_body.txt)
          echo "HTTP $HTTP — $BODY"

          if [ "$HTTP" = "200" ]; then
            echo "✅ Panel sweep OK for $ENV"
          else
            # 404 is a failure too: the route has been live on both envs since
            # v1.50.0 (2026-07-11), so "not found" now means a rename or proxy
            # regression, not "not deployed yet".
            echo "❌ Panel sweep failed for $ENV (HTTP $HTTP)"
            exit 1
          fi
