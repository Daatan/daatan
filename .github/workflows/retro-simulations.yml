name: Retro Simulations

# The retro generator (daatan#2217): turns this week's reported events that no forecast asked
# about into private "what Oracul would have said a week before" drafts in the approvals queue.
#
#   1. POST /api/admin/retro/candidates — cluster the evidence pool's reported facts, judge each
#      cluster (one dated past event?), write nothing.
#   2. POST /api/admin/retro/simulate — one candidate per request (an event check, up to 35 s,
#      and one Oracul analysis, up to 75 s): articles published before T0 from the whole news
#      index, the check (on topic? already reports the event? already forecast? — daatan#2229),
#      Oracul as of T0 from the on-topic ones, and with mode=apply a PENDING_APPROVAL draft.
#      Approving it resolves it; nothing is published.
#
# Daily on production in apply mode (Mark, 2026-11-22, daatan#2217). A manual dispatch is still
# dry-run by default. Draft creation notifies no one, so an apply run on production posts one
# line to the quiet Telegram channel when it creates drafts or a simulate call errors. A failed
# scheduled run posts too. Nothing is remembered between runs: an event skipped today is judged
# again tomorrow, and drafted events (rejected ones too) are skipped as `duplicate_retro` /
# `already_forecast`. Auth is the x-cron-secret (BOT_RUNNER_SECRET) header.

on:
  schedule:
    # Daily 06:41 UTC (08:41 Israel): the drafts are waiting in the morning. Off the 06:15/06:17
    # crons. T0 is a week before the event, so a day's delay costs nothing.
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Environment
        type: choice
        options: [staging, production]
        default: staging
      mode:
        description: dry-run shows what would be drafted; apply writes the drafts
        type: choice
        options: [dry-run, apply]
        default: dry-run
      days:
        description: Evidence-pool window, days
        default: '7'
      max_clusters:
        description: Clusters to judge (largest first; 40 took 70–89 s against the 118 s limit)
        default: '30'
      max_events:
        description: Candidates to simulate (each is one Oracul analysis)
        default: '10'
      min_similarity:
        description: news-indexer similarity floor for the pre-T0 articles (0.30–0.95; empty = the app default)
        default: '0.40'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    name: ${{ github.event_name == 'schedule' && 'daily apply on production' || format('{0} on {1}', inputs.mode, inputs.target) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A scheduled run has no inputs; the schedule's parameters are the right-hand values below.
    # max_events 15 matches the measured dry run of 2026-11-22 (14 candidates, 4 would-be drafts).
    # Already-drafted events skip before the Oracul, so the extra slots cost little.
    env:
      TARGET: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
      MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
      DAYS: ${{ github.event_name == 'schedule' && '7' || inputs.days }}
      MAX_CLUSTERS: ${{ github.event_name == 'schedule' && '30' || inputs.max_clusters }}
      MAX_EVENTS: ${{ github.event_name == 'schedule' && '15' || inputs.max_events }}
      MIN_SIMILARITY: ${{ github.event_name == 'schedule' && '0.40' || inputs.min_similarity }}
    steps:
      - name: Find candidates and simulate them one by one
        id: run
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^(staging|production)$ ]] || { echo "::error::bad target"; exit 1; }
          [[ "$MODE" =~ ^(dry-run|apply)$ ]] || { echo "::error::bad mode"; exit 1; }
          [[ "$DAYS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::days must be an integer"; exit 1; }
          [[ "$MAX_CLUSTERS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::max_clusters must be an integer"; exit 1; }
          [[ "$MAX_EVENTS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::max_events must be an integer"; exit 1; }
          [[ -z "$MIN_SIMILARITY" || "$MIN_SIMILARITY" =~ ^0\.[0-9]{1,2}$ ]] || { echo "::error::min_similarity must look like 0.45"; exit 1; }
          if [ "$TARGET" = "production" ]; then BASE="https://daatan.com"; else BASE="$STAGING_URL"; fi
          [ -n "$BASE" ] || { echo "::error::No URL configured for $TARGET"; exit 1; }

          BODY=$(jq -nc --argjson d "$DAYS" --argjson m "$MAX_CLUSTERS" '{days:$d, maxClusters:$m}')
          HTTP=$(curl -s -o candidates.json -w '%{http_code}' --max-time 118 -X POST \
            -H "x-cron-secret: $BOT_RUNNER_SECRET" -H 'Content-Type: application/json' \
            -d "$BODY" "$BASE/api/admin/retro/candidates")
          [ "$HTTP" = "200" ] || { echo "::error::candidates HTTP $HTTP"; head -c 500 candidates.json; exit 1; }

          {
            echo "## Retro simulations — $MODE on $TARGET${MIN_SIMILARITY:+ (min_similarity $MIN_SIMILARITY)}"
            jq -r '"Pool claims \(.claims) → reports \(.reports) → clusters \(.clusters) → multi-source \(.multiSource) (already covered \(.known)) → judged \(.judged) → events \((.candidates | length) + .merged) → **candidates \(.candidates | length)** after folding \(.merged) same-event duplicates. Timings ms: \(.timingsMs | tostring)"' candidates.json
            echo
            echo "Skipped at the judge:"
            jq -r '[.skipped[].reason] | group_by(.) | map("- \(.[0]): \(length)") | .[]' candidates.json
            echo
            echo "Candidates (largest first; folded duplicates and reports dated too early to move T0 shown per line):"
            jq -r '.candidates | to_entries[] | "\(.key + 1). \(.value.sources) outlets · event \(.value.event.date) · T0 \(.value.preview.asOf[0:10])\(if .value.preview.earlyReports > 0 then " · \(.value.preview.earlyReports) early" else "" end) — \(.value.preview.claimText)\(if (.value.merged | length) > 0 then " — folded: " + ([.value.merged[].claimText] | join(" / ")) else "" end)"' candidates.json
            echo
            echo "| # | Status | P(T0) | Articles | T0 | Claim / reason |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          N=$(jq '.candidates | length' candidates.json)
          [ "$N" -gt "$MAX_EVENTS" ] && N=$MAX_EVENTS
          CREATED=0; ERRORS=0; : > drafts.txt
          for i in $(seq 0 $((N - 1))); do
            REQ=$(jq -c --argjson i "$i" --arg mode "$MODE" --arg sim "$MIN_SIMILARITY" \
              '.candidates[$i] | {reports, event, claimTemplate, rulesTemplate, mode:$mode}
               + (if $sim == "" then {} else {minSimilarity: ($sim | tonumber)} end)' candidates.json)
            OUT=$(curl -s --max-time 125 -X POST \
              -H "x-cron-secret: $BOT_RUNNER_SECRET" -H 'Content-Type: application/json' \
              -d "$REQ" "$BASE/api/admin/retro/simulate") || OUT='{"status":"error","reason":"no response"}'
            # Whole response: the per-article similarities and stances are what a hand-read needs.
            # `|| true`: head closing early on a long response must not abort the run under pipefail.
            echo "event $((i + 1))/$N: $OUT" | head -c 60000 || true; echo
            echo "$OUT" | jq -r --argjson n "$((i + 1))" \
              'if .status == "created" or .status == "dry_run"
               then "| \($n) | \(.status) | \((.probability * 100) | round)% | \(.articlesUsed)/\(.articles | length) (\(.check.offTopic | length) off-topic) | \(.asOf[0:10]) | \(.claimText | gsub("\\|"; "/")) |"
               else "| \($n) | \(.status // "error") | | | | \(.reason // .error // "?"): \((.claimText // "") | gsub("\\|"; "/"))\((.detail | if type == "object" then .why else null end) // "" | if . == "" then "" else " — " + gsub("\\|"; "/") end) |" end' \
              >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "| $((i + 1)) | error | | | | unparseable response |" >> "$GITHUB_STEP_SUMMARY"
            STATUS=$(echo "$OUT" | jq -r '.status // "error"' 2>/dev/null) || STATUS=error
            if [ "$STATUS" = "created" ]; then
              CREATED=$((CREATED + 1))
              echo "$OUT" | jq -r '"• \(.claimText[0:140]) (P \((.probability * 100) | round)% at T0 \(.asOf[0:10]))"' >> drafts.txt \
                || echo "• draft $((i + 1)) (unreadable response)" >> drafts.txt
            elif [ "$STATUS" != "skipped" ] && [ "$STATUS" != "dry_run" ]; then
              ERRORS=$((ERRORS + 1))
            fi
            sleep 2
          done
          { echo "simulated=$N"; echo "created=$CREATED"; echo "errors=$ERRORS"; } >> "$GITHUB_OUTPUT"

      # The quiet channel: drafts are an action item for Mark, like a new forecast. The chat id
      # falls back to the noisy channel if the clean one is unset (docs/TELEGRAM_NOTIFICATIONS.md).
      - name: Ping Telegram about new drafts
        if: env.TARGET == 'production' && env.MODE == 'apply' && (steps.run.outputs.created != '0' || steps.run.outputs.errors != '0')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLEAN_CHAT_ID: ${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}
          NOISY_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CREATED: ${{ steps.run.outputs.created }}
          ERRORS: ${{ steps.run.outputs.errors }}
          SIMULATED: ${{ steps.run.outputs.simulated }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          CHAT_ID="${CLEAN_CHAT_ID:-$NOISY_CHAT_ID}"
          MSG="🔁 Retro: $CREATED new draft(s) awaiting approval ($SIMULATED simulated"
          [ "$ERRORS" != "0" ] && MSG+=", $ERRORS error(s)"
          MSG+=")"
          [ -s drafts.txt ] && MSG+=$'\n'"$(cat drafts.txt)"
          MSG+=$'\n'"https://daatan.com/admin/approvals"$'\n'"Run: $RUN_URL"
          curl -sf -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" --data-urlencode "text=$MSG" \
            -d "disable_web_page_preview=true"

      - name: Ping Telegram if the daily run failed
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLEAN_CHAT_ID: ${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}
          NOISY_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CHAT_ID="${CLEAN_CHAT_ID:-$NOISY_CHAT_ID}"
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=🚨 Retro daily run FAILED"$'\n'"Run: $RUN_URL" \
            -d "disable_web_page_preview=true"
