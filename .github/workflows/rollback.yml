name: 🔄 Rollback — Revert to a previous version

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '🌍 Which environment to roll back?'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      version:
        description: '🏷️ Version number to restore (e.g. 1.7.174). Available versions are listed below.'
        required: true
        type: string
      reason:
        description: '📝 Why are you rolling back? (shown in Telegram notification)'
        required: false
        type: string

env:
  ECR_REGISTRY: 272007598366.dkr.ecr.eu-central-1.amazonaws.com

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }} to v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    env:
      ROLLBACK_ENV: ${{ inputs.environment }}
      ROLLBACK_VERSION: ${{ inputs.version }}
      ROLLBACK_REASON: ${{ inputs.reason }}

    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$ROLLBACK_ENV" =~ ^(production|staging)$ ]]; then
            echo "::error::environment must be production or staging"
            exit 1
          fi
          if [[ ! "$ROLLBACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (e.g. 1.7.174)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: List available versions
        run: |
          echo "=========================================="
          echo "  Available version tags in ECR (newest first)"
          echo "=========================================="
          aws ecr describe-images \
            --repository-name daatan-app \
            --region eu-central-1 \
            --query 'sort_by(imageDetails,&imagePushedAt)[-30:].imageTags' \
            --output json 2>/dev/null \
          | python3 -c "
          import sys, json
          tags_list = json.load(sys.stdin)
          versions = set()
          for tags in tags_list:
            if tags:
              for t in tags:
                # Only show version-like tags (e.g. 1.7.174)
                parts = t.split('.')
                if len(parts) == 3 and all(p.isdigit() for p in parts):
                  versions.add(t)
          for v in sorted(versions, key=lambda x: [int(n) for n in x.split('.')], reverse=True):
            print(f'  {v}')
          " || echo "  (could not parse tags)"
          echo ""
          echo "  You entered version: $ROLLBACK_VERSION"
          echo "=========================================="

      - name: Verify ECR image tag exists
        run: |
          echo "Checking ECR for image tag: $ROLLBACK_VERSION"
          if ! aws ecr describe-images \
              --repository-name daatan-app \
              --image-ids "imageTag=$ROLLBACK_VERSION" \
              --region eu-central-1 \
              --output text > /dev/null 2>&1; then
            echo "ERROR: Image tag '$ROLLBACK_VERSION' not found in ECR repository 'daatan-app'"
            echo ""
            echo "Tip: Look at the 'List available versions' step above to see valid options."
            exit 1
          fi
          echo "Image tag '$ROLLBACK_VERSION' confirmed in ECR ✅"

      - name: Find EC2 instance
        id: instance
        run: |
          if [ "$ROLLBACK_ENV" = "production" ]; then
            ENV_TAG="prod"
          else
            ENV_TAG="staging"
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=$ENV_TAG" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: Could not find EC2 instance with Environment=$ENV_TAG"
            exit 1
          fi

          echo "Found instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Check Instance SSM Health
        # Staging sleeps 20:00–06:00 UTC + weekends (terraform/staging_schedule.tf,
        # #1526): wake it and wait for SSM. Production is never started from CI —
        # if it is not Online that is an incident, not a schedule.
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          if [ "$ROLLBACK_ENV" != "production" ]; then
            STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" --output text)
            echo "Instance $INSTANCE_ID state: $STATE"
            if [[ "$STATE" == "stopped" ]]; then
              echo "Staging is asleep — starting it"
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
            elif [[ "$STATE" == "stopping" ]]; then
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
            fi
          fi

          for i in $(seq 1 30); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)
            echo "Instance $INSTANCE_ID PingStatus: $PING_STATUS ($i/30)"
            [[ "$PING_STATUS" == "Online" ]] && exit 0
            [ "$ROLLBACK_ENV" = "production" ] && break
            sleep 10
          done
          echo "ERROR: Instance is $PING_STATUS. SSM command will fail."
          exit 1

      - name: Send rollback command via SSM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"

          if [ "$ROLLBACK_ENV" = "production" ]; then
            DEPLOY_FILES="scripts/blue-green-deploy.sh scripts/verify-health.sh scripts/verify-logs.sh scripts/verify-deploy.sh docker-compose.prod.yml infra/nginx/nginx-prod-ssl.conf"
            LOCAL_TAG="daatan-app:latest"
            BG_ENV="production"
          else
            DEPLOY_FILES="scripts/blue-green-deploy.sh scripts/verify-health.sh scripts/verify-logs.sh scripts/verify-deploy.sh docker-compose.staging.yml infra/nginx/nginx-staging-ssl.conf"
            LOCAL_TAG="daatan-app:staging-latest"
            BG_ENV="staging"
          fi

          IMAGE_TAG="$ROLLBACK_VERSION"
          FULL_IMAGE="$ECR_REGISTRY/daatan-app:$IMAGE_TAG"

          # Build the SSM parameters with jq so every value is JSON-encoded.
          PARAMS=$(jq -nc \
            --arg files "$DEPLOY_FILES" \
            --arg token "$GH_TOKEN" \
            --arg raw "$RAW_BASE" \
            --arg registry "$ECR_REGISTRY" \
            --arg image "$FULL_IMAGE" \
            --arg local_tag "$LOCAL_TAG" \
            --arg image_tag "$IMAGE_TAG" \
            --arg bg_env "$BG_ENV" \
            '{commands: [
              "set -e",
              "export HOME=/home/ubuntu",
              "export PATH=$PATH:/usr/local/bin:/usr/bin",
              "",
              "echo \"📦 Downloading deploy scripts from GitHub...\"",
              "mkdir -p ~/app/scripts ~/app/infra/nginx",
              "cd ~/app",
              "for f in \($files); do curl -sfL -H \"Authorization: token \($token)\" \"\($raw)/$f\" -o \"$f\" && echo \"  OK: $f\" || { echo \"  FAIL: $f\"; exit 1; }; done",
              "chmod +x scripts/*.sh",
              "",
              "echo \"🔐 Logging in to ECR...\"",
              "aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin \($registry)",
              "",
              "echo \"⬇️ Pulling rollback image: \($image)\"",
              "docker pull \($image)",
              "",
              "echo \"🏷️ Tagging image as \($local_tag)\"",
              "docker tag \($image) \($local_tag)",
              "",
              "echo \"🔄 Executing blue-green rollback deployment...\"",
              "export GIT_COMMIT=rollback-\($image_tag)",
              "export SKIP_BUILD=true",
              "export ECR_REGISTRY=\($registry)",
              "export IMAGE_TAG=\($image_tag)",
              "./scripts/blue-green-deploy.sh \($bg_env)"
            ]}')

          echo "Sending rollback SSM command..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${{ steps.instance.outputs.instance_id }}" \
            --comment "Rollback $ROLLBACK_ENV to $ROLLBACK_VERSION" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --output text \
            --query "Command.CommandId")

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command to complete
        id: ssm_result
        run: |
          COMMAND_ID="${{ env.COMMAND_ID }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          MAX_ATTEMPTS=60
          SLEEP_SECS=15

          echo "Polling SSM command $COMMAND_ID ..."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i/$MAX_ATTEMPTS: $STATUS"

            case "$STATUS" in
              Success)
                echo "SSM command succeeded"
                # Print output for visibility
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text 2>/dev/null | tail -50 || true
                echo "ssm_status=success" >> $GITHUB_OUTPUT
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "SSM command failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text 2>/dev/null | tail -50 || true
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text 2>/dev/null | tail -50 || true
                echo "ssm_status=failed" >> $GITHUB_OUTPUT
                exit 1
                ;;
              *)
                sleep $SLEEP_SECS
                ;;
            esac
          done

          echo "Timed out waiting for SSM command to complete"
          echo "ssm_status=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Verify rollback health
        if: success()
        run: |
          if [ "$ROLLBACK_ENV" = "production" ]; then
            HEALTH_URL="https://daatan.com/api/health"
          else
            HEALTH_URL="https://staging.daatan.com/api/health"
          fi
          echo "Checking health at $HEALTH_URL ..."
          sleep 10
          for i in 1 2 3 4 5; do
            RUNNING_VER=$(curl -sf --connect-timeout 5 "$HEALTH_URL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version','unknown'))" 2>/dev/null || echo "unreachable")
            echo "Attempt $i: running version = $RUNNING_VER"
            if [ "$RUNNING_VER" = "$ROLLBACK_VERSION" ]; then
              echo "✅ Confirmed: $ROLLBACK_ENV is running v$ROLLBACK_VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Warning: health endpoint reports version '$RUNNING_VER', expected '$ROLLBACK_VERSION'"
          echo "The deployment may still be stabilizing — check manually."

      - name: Notify Telegram - Rollback Success
        if: success()
        run: |
          REASON="$ROLLBACK_REASON"
          REASON_TEXT=""
          if [ -n "$REASON" ]; then
            REASON_TEXT="%0AReason: $REASON"
          fi
          MSG="🔄 [$ROLLBACK_ENV] Rollback to v$ROLLBACK_VERSION complete.$REASON_TEXT%0A%0ATriggered by: $GITHUB_ACTOR%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"
          # Prod rollback → clean channel; staging stays noisy
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ "$ROLLBACK_ENV" = "production" ]; then
            CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
            CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      - name: Notify Telegram - Rollback Failed
        if: failure()
        run: |
          REASON="$ROLLBACK_REASON"
          REASON_TEXT=""
          if [ -n "$REASON" ]; then
            REASON_TEXT="%0AReason: $REASON"
          fi
          MSG="❌ [$ROLLBACK_ENV] Rollback to v$ROLLBACK_VERSION FAILED. Manual intervention required.$REASON_TEXT%0A%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"
          # Prod rollback failure → clean channel; staging stays noisy
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ "$ROLLBACK_ENV" = "production" ]; then
            CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
            CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
