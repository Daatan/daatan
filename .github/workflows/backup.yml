name: Database Backup

# MANUAL ONLY. The schedule is EventBridge Scheduler → SSM Run Command
# (terraform/backup_schedule.tf, #1957), which runs the copies of
# backup-db.sh / verify-backup.sh that deploy.yml ships to the prod box. The
# GitHub cron fallback was retired on 2026-10-27 after 12/12 on-time
# EventBridge runs: it fired 3–6 h late, found the lock free and took a second
# full backup each time, which halved retention under keep-newest-60.
# Both paths take the same box-side lock, so a manual run during a scheduled
# one is a harmless no-op.
on:
  workflow_dispatch:

# One backup at a time (#1957): two overlapping runs share the box, the dump
# path and the fixed-name restore-verification container, and both fail.
# Queue, never cancel — cancelling a running backup can leave a partial
# upload or a half-restored verify container behind. (GitHub keeps at most
# one pending run per group; a newer queued run supersedes an older queued
# one, which is fine — it is the same backup, just later.)
concurrency:
  group: db-backup-prod
  cancel-in-progress: false

jobs:
  backup:
    name: Run DB backup
    runs-on: ubuntu-latest
    # Backup poll ≤25 min + restore verification poll ≤55 min + setup/alert. The two
    # polls use separate 60-min AWS sessions (see "Refresh AWS credentials").
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trigger backup via SSM
        id: backup
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=prod" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "Instance: $INSTANCE_ID"

          SCRIPT=$(base64 -w 0 scripts/backup-db.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Scheduled DB backup $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --parameters "commands=[\"echo $SCRIPT | base64 -d > /tmp/backup-db.sh && bash /tmp/backup-db.sh\"]" \
            --output text \
            --query "Command.CommandId")
          echo "Command ID: $COMMAND_ID"

          # Wait up to 25 minutes: a ~4 GB dump streamed to S3 takes 15-20 (2026-11).
          # This used to be 10, and running out of loop fell through with no status: the
          # job went green, verification was skipped, and the backup was still running
          # on the box (daatan#2168).
          for i in $(seq 1 150); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" --details \
              --query "CommandInvocations[0].Status" --output text)
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              # The EventBridge schedule (terraform/backup_schedule.tf) is the
              # primary trigger; this cron is the fallback. If that run held the
              # box-side lock, backup-db.sh exited 0 with BACKUP_SKIPPED — a
              # green no-op, and verification is that run's job, not this one's.
              OUTPUT=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" --output text)
              if grep -q '^BACKUP_SKIPPED' <<< "$OUTPUT"; then
                echo "ℹ️ Another backup run is in progress on the box (scheduled run) — skipping"
                echo "status=skipped" >> "$GITHUB_OUTPUT"
              else
                echo "✅ Backup completed"
                echo "status=success" >> "$GITHUB_OUTPUT"
              fi
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              OUTPUT=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" --output text)
              echo "❌ Backup failed: $OUTPUT"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 10
          done
          if [[ -z "$STATUS" || "$STATUS" == "InProgress" || "$STATUS" == "Pending" || "$STATUS" == "Delayed" ]]; then
            echo "❌ Backup did not finish in 25 minutes (last status: ${STATUS:-none}); command $COMMAND_ID may still be running on the box"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "output=timed out waiting for SSM command $COMMAND_ID" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # The AWS session lasts 60 min (the role's MaxSessionDuration is 3600 s), and
      # backup + verify together take longer. On 2026-11-26 the token expired
      # mid-poll after 60 min, the job failed and alerted, and the restore check
      # on the box passed 3 min later (daatan#2303). Fresh credentials here give
      # the verify step its own 60 min, so its poll must stay under that.
      - name: Refresh AWS credentials for the verify step
        if: steps.backup.outputs.status == 'success'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Verify backup restore via SSM
        if: steps.backup.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=daatan-backend" "Name=tag:Environment,Values=prod" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "Instance: $INSTANCE_ID"

          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"

          # Wait for the result: this used to be fire-and-forget, so the job stayed
          # green while every verification failed for weeks (#1808). A failure here
          # fails the job, which triggers the Telegram step below.
          # The restore runs in a memory-capped throwaway container. --timeout-seconds
          # is only SSM's delivery timeout; the run itself gets AWS-RunShellScript's
          # default 3600 s, and verify-backup.sh stops its own restore at 3000 s
          # (VERIFY_RESTORE_TIMEOUT default) with a Telegram alert (daatan#2303).
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Backup restore verification $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --timeout-seconds 1200 \
            --parameters commands='[
              "set -e",
              "mkdir -p ~/app/scripts",
              "cd ~/app",
              "curl -sfL -H \"Authorization: token '"$GH_TOKEN"'\" \"'"$RAW_BASE"'/scripts/verify-backup.sh\" -o \"scripts/verify-backup.sh\"",
              "chmod +x scripts/verify-backup.sh",
              "./scripts/verify-backup.sh"
            ]' \
            --output text \
            --query "Command.CommandId")
          echo "Command ID: $COMMAND_ID"

          # Up to 55 min, just past the script's 50-min restore budget: restoring the
          # ~4 GB dump took 22 min on 2026-11-14 (daatan#2168), 25 min for 4.7 GB on
          # 2026-11-20 and 39 min for 5.6 GiB on 2026-11-26 (daatan#2303). Bounded by
          # the clock, not a loop count: each poll takes ~11 s, so 330 polls ran ~61
          # min, past the 60-min session.
          POLL_UNTIL=$(( $(date +%s) + 55 * 60 ))
          while [ "$(date +%s)" -lt "$POLL_UNTIL" ]; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" --details \
              --query "CommandInvocations[0].Status" --output text)
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" --output text | tail -5
              echo "✅ Backup restore verified"
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" --output text \
                | tail -20
              echo "❌ Backup restore verification failed"
              exit 1
            fi
            sleep 10
          done
          echo "❌ Backup restore verification did not finish in 55 minutes"
          exit 1

      - name: Alert via Telegram on failure
        if: failure()
        run: |
          # Backup failure is page-worthy and prod-only → clean channel (fallback to noisy if unset)
          CHAT_ID="${{ secrets.TELEGRAM_CLEAN_CHAT_ID }}"
          CHAT_ID="${CHAT_ID:-${{ secrets.TELEGRAM_CHAT_ID }}}"
          if [[ "${{ steps.backup.outputs.status }}" == "success" ]]; then
            MSG="🚨 <b>DB Backup restore verification FAILED</b>%0AThe backup uploaded, but restoring it failed. See the workflow run.%0ATime: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            MSG="🚨 <b>DB Backup FAILED</b>%0ATime: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MSG" \
            -d "parse_mode=HTML"
