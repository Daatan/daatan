name: Backfill Oracle Sources

# Populates the Oracul source roster (the "sources behind the AI estimate" panel)
# for ACTIVE forecasts created before per-source capture existed. Drives the
# admin route POST /api/admin/forecasts/backfill-oracle-sources in bounded rounds
# until `remaining` reaches 0. Auth is the x-cron-secret (BOT_RUNNER_SECRET) header,
# same as the cron routes — the secret only ever lives in the Actions runner.
#
# Manual, on-demand: Actions → Backfill Oracul Sources → Run workflow.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to backfill
        type: choice
        options: [staging, production]
        default: staging
      limit:
        description: Forecasts per round (small = shorter requests, avoids proxy timeouts)
        default: '3'
      max_rounds:
        description: Safety cap on rounds
        default: '80'

jobs:
  backfill:
    name: Backfill ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Drive backfill until drained
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          BOT_RUNNER_SECRET: ${{ secrets.BOT_RUNNER_SECRET }}
          TARGET: ${{ inputs.target }}
          LIMIT: ${{ inputs.limit }}
          MAX_ROUNDS: ${{ inputs.max_rounds }}
        run: |
          [[ "$TARGET" =~ ^(staging|production)$ ]] || { echo "::error::target must be staging or production"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]{1,4}$ ]] || { echo "::error::limit must be a positive integer"; exit 1; }
          [[ "$MAX_ROUNDS" =~ ^[0-9]{1,5}$ ]] || { echo "::error::max_rounds must be a positive integer"; exit 1; }
          if [ "$TARGET" = "production" ]; then
            BASE="https://daatan.com"
          else
            BASE="$STAGING_URL"
          fi
          if [ -z "$BASE" ]; then echo "❌ No URL configured for $TARGET"; exit 1; fi
          echo "Target: $BASE (limit=$LIMIT/round, up to $MAX_ROUNDS rounds)"

          # A round writes a snapshot (or an empty "attempted" marker) for every
          # forecast it touches, so `remaining` strictly decreases and the loop
          # converges. A slow/timed-out round is transient — log and retry, don't abort.
          errstreak=0
          for i in $(seq 1 "$MAX_ROUNDS"); do
            BODY=$(curl -s --max-time 180 -X POST \
              -H "x-cron-secret: $BOT_RUNNER_SECRET" \
              "$BASE/api/admin/forecasts/backfill-oracle-sources?limit=$LIMIT") || BODY=""
            echo "round $i: ${BODY:-<no response>}"

            REMAINING=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('remaining','ERR'))" 2>/dev/null || echo ERR)
            if [ "$REMAINING" = "0" ]; then
              echo "✅ Drained — every active forecast now has an Oracle snapshot (or attempted marker)"
              exit 0
            fi
            if [ "$REMAINING" = "ERR" ]; then
              errstreak=$((errstreak + 1))
              echo "round $i: no/invalid response (transient) — streak $errstreak"
              if [ "$errstreak" -ge 5 ]; then
                echo "❌ 5 consecutive bad responses — likely auth/server error, aborting"
                exit 1
              fi
              sleep 8
              continue
            fi
            errstreak=0
            sleep 3
          done

          echo "⚠️ Hit max_rounds with $REMAINING still remaining — re-run to continue"
