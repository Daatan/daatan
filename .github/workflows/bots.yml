name: Bot Runner

on:
  # STOPPED 2026-08-04 by explicit instruction, and disabled at the Actions API
  # as well (`gh workflow disable bots.yml`) so it is off from both directions.
  #
  # Why: this fired every 5 minutes (288 triggers/day) at STAGING, and staging's
  # ORACLE_URL points at the PRODUCTION Oracle. Each resulting forecast sends no
  # `articles` array, so retro ran its own search chain and extracted up to
  # max_articles=10 articles on Claude Haiku per request — ~64 prod Oracle calls
  # a day originating from staging, against ~$3.2k of remaining AWS credits.
  # That is docs#57's finding 1, and this schedule was its mechanism.
  #
  # To restart: uncomment the schedule AND run `gh workflow enable bots.yml`.
  # Before doing either, point staging at a non-production Oracle or give it a
  # key with a per-key max_articles cap — otherwise restarting restores the burn.
  #
  # schedule:
  #   # Every 5 minutes — the API checks which bots are actually due
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate but do not post)'
        required: false
        default: 'false'
        type: boolean

jobs:
  trigger-bots:
    name: Trigger bot runner on staging
    runs-on: ubuntu-latest
    # Only run on the main branch (staging target)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger bot runner
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          URL="${{ secrets.STAGING_URL }}/api/bots/run"

          echo "Triggering bot runner at $URL (dry=$DRY_RUN)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$URL" \
            -H "x-bot-runner-secret: ${{ secrets.BOT_RUNNER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"dryRun\":$DRY_RUN}" \
            --max-time 270)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response: $BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Bot runner failed with status $HTTP_CODE"
            exit 1
          fi
