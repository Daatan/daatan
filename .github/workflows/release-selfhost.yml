name: Release self-hosted image

# Publishes the self-hosted edition image (app + migrations) to GHCR so a
# customer's docker-compose can PULL it instead of building from source.
#
# Manual-dispatch only by design: it must never fire on a normal prod tag, and
# it touches nothing in the SaaS pipeline (no ECR, no EC2, no AWS). To later
# auto-publish on release tags, add a `push: tags: ['v*']` trigger.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.18.25). Defaults to package.json version.'
        required: false
        type: string

jobs:
  publish:
    name: Build & push self-hosted image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve image name and version
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/daatan-selfhost" >> "$GITHUB_OUTPUT"
          VER="${{ inputs.version }}"
          [ -z "$VER" ] && VER="$(node -p "require('./package.json').version")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing ghcr.io/$OWNER/daatan-selfhost:$VER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: runner
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            DATABASE_URL=postgresql://placeholder
            NEXTAUTH_URL=https://example.com

      - name: Build & push migrations image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: migrations
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-migrations
            ${{ steps.meta.outputs.image }}:latest-migrations
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            DATABASE_URL=postgresql://placeholder
            NEXTAUTH_URL=https://example.com

      - name: Summary
        run: |
          {
            echo "### Self-hosted image published"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-migrations\`"
            echo ""
            echo "The package is **private**. A customer authenticates once, then pulls:"
            echo '```'
            echo 'echo "$GHCR_TOKEN" | docker login ghcr.io -u <user> --password-stdin   # token needs read:packages'
            echo "export DAATAN_VERSION=${{ steps.meta.outputs.version }}"
            echo "docker compose -f docker-compose.selfhost.pull.yml up -d"
            echo '```'
            echo ""
            echo "See docs/SELF_HOSTING.md §8 for the full publish + pull flow."
          } >> "$GITHUB_STEP_SUMMARY"
