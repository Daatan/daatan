name: 'SSM Deploy'
description: 'Check SSM instance health and poll an SSM command to completion'

inputs:
  command-id:
    description: 'SSM Command ID returned by send-command'
    required: true
  health-url:
    description: 'URL to verify after deployment (e.g. https://staging.daatan.com)'
    required: true
  app-version:
    description: 'Expected app version reported by the health endpoint'
    required: true

runs:
  using: composite
  steps:
    - name: Wait for SSM command
      shell: bash
      run: |
        COMMAND_ID="${{ inputs.command-id }}"
        # A migration deploy includes the pre-migrate DB dump (about 9.5 min on prod in
        # v1.66.38, and it grows with the DB). Stay under the jobs' 30 min timeout-minutes.
        TIMEOUT_MINUTES=25
        echo "⏳ Waiting for SSM command $COMMAND_ID (timeout: ${TIMEOUT_MINUTES}m)..."
        START_TIME=$(date +%s)
        while true; do
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" --details \
            --query "CommandInvocations[0].Status" --output text)
          echo "Status: $STATUS"
          if [[ "$STATUS" == "Success" ]]; then
            echo "✅ SSM command succeeded"
            break
          elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
            echo "❌ SSM command failed ($STATUS)"
            aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" --details \
              --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
            exit 1
          fi
          ELAPSED=$(( $(date +%s) - START_TIME ))
          if [[ $ELAPSED -gt $(( TIMEOUT_MINUTES * 60 )) ]]; then
            echo "❌ Timed out after ${TIMEOUT_MINUTES} minutes waiting for SSM command. It may still be running on the host."
            exit 1
          fi
          sleep 5
        done

    - name: Verify health endpoint
      shell: bash
      run: |
        VERSION="${{ inputs.app-version }}"
        if [ "$VERSION" = "skip" ]; then
          ./scripts/verify-health.sh "${{ inputs.health-url }}"
        else
          ./scripts/verify-health.sh "${{ inputs.health-url }}" "$VERSION"
        fi
