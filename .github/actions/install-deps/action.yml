name: 'Install dependencies (cached)'
description: >
  Restores node_modules from a cache keyed on package-lock.json + the Prisma
  schema, running `npm ci` (and its postinstall `prisma generate`) only on a
  cache miss.

runs:
  using: composite
  steps:
    - name: Cache node_modules
      id: cache
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'prisma/schema.prisma') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
