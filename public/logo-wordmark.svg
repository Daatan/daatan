<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    <linearGradient id="iconBaseGrad" gradientUnits="userSpaceOnUse" x1="16" y1="48" x2="48" y2="16">
      <stop offset="0%" style="stop-color:#1D4ED8"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="iconAccentGrad" gradientUnits="userSpaceOnUse" x1="16" y1="48" x2="48" y2="16">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#7DD3FC"/>
    </linearGradient>
  </defs>

  <!-- Icon (mini version) — same radar-icon glyph as logo-icon.svg -->
  <g transform="translate(10, 15)">
    <g transform="translate(35,35) scale(1.3) translate(-32,-32)">
      <path d="M 44.43 21.93 A 16 16 0 1 1 28.13 16.48"
            stroke="url(#iconBaseGrad)" stroke-width="1.75" stroke-linecap="round" fill="none"/>
      <path d="M 30.99 17.54 A 14.5 14.5 0 0 1 43.27 22.87"
            stroke="url(#iconAccentGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <circle cx="32" cy="32" r="10" stroke="url(#iconBaseGrad)" stroke-width="1" fill="none"/>
      <line x1="32" y1="16" x2="32" y2="48" stroke="url(#iconBaseGrad)" stroke-width="0.9"/>
      <line x1="16" y1="32" x2="48" y2="32" stroke="url(#iconBaseGrad)" stroke-width="0.9"/>
      <line x1="32" y1="32" x2="43.15" y2="21.96" stroke="url(#iconAccentGrad)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="4" fill="url(#iconBaseGrad)"/>
    </g>
  </g>

  <!-- DAATAN text with stylized 'A's -->
  <text x="95" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="#1F2937" letter-spacing="4">
    <tspan>D</tspan>
    <tspan fill="#3B82F6">A</tspan>
    <tspan fill="#3B82F6">A</tspan>
    <tspan>T</tspan>
    <tspan fill="#3B82F6">A</tspan>
    <tspan>N</tspan>
  </text>

  <!-- Subtle underline accent -->
  <line x1="95" y1="78" x2="370" y2="78" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Small tagline -->
  <text x="95" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" letter-spacing="2">
    FORECAST TRACKING
  </text>
</svg>
